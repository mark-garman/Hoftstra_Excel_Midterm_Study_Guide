<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT 001 Introduction to Excel: Midterm Study Coach</title>
<style>
:root{
  --blue:#00529B; --blue-dark:#003A70; --blue-soft:#E6EFF8;
  --gold:#FFB81C; --gold-soft:#FFF4D6;
  --ink:#1B2430; --muted:#5B6675; --line:#D8DEE6; --bg:#F4F6F9; --card:#FFFFFF;
  --good:#1E8449; --good-soft:#E3F3E9; --bad:#B03A2E; --bad-soft:#FBE7E4; --grey:#C9D0D9;
  color-scheme: light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:16px}
header.top{background:var(--blue);color:#fff;border-bottom:5px solid var(--gold)}
header.top .in{max-width:1040px;margin:0 auto;padding:16px 20px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
header.top h1{margin:0;font-size:1.35rem;letter-spacing:.2px}
header.top .sub{font-size:.9rem;opacity:.9}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav.tabs .in{max-width:1040px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--blue)}
nav.tabs button.on{color:var(--blue);border-bottom-color:var(--gold)}
main{max-width:1040px;margin:0 auto;padding:20px}
h2{margin:.2em 0 .5em;font-size:1.4rem;color:var(--blue-dark)}
h3{margin:1.2em 0 .4em;font-size:1.1rem;color:var(--blue-dark)}
h4{margin:.8em 0 .3em}
p{margin:.5em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:0 0 16px}
.card.flat{padding:12px 16px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.grow{flex:1 1 280px}
.btn{font:inherit;font-weight:600;border:1px solid var(--blue);background:#fff;color:var(--blue);padding:9px 16px;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--blue-soft)}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-dark)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2b2000}
.btn.gold:hover{background:#f5aa00}
.btn.small{padding:5px 11px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:default}
.btn.link{border:0;background:none;padding:0;text-decoration:underline}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue-dark)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.gold{background:var(--gold-soft);color:#7a5400}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.stat b{display:block;font-size:1.7rem;color:var(--blue-dark);line-height:1.1}
.stat span{font-size:.85rem;color:var(--muted)}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--grey)}
.bar i{display:block;height:100%}
.bar .g{background:var(--good)} .bar .r{background:var(--bad)}
.trow{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(120px,1fr) auto;gap:10px 14px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .nm{font-weight:600;cursor:pointer}
.trow .nm:hover{color:var(--blue)}
.trow .meta{font-size:.8rem;color:var(--muted)}
@media (max-width:640px){.trow{grid-template-columns:1fr auto}.trow .bar{grid-column:1/-1;order:3}}
.tip{background:var(--gold-soft);border-left:4px solid var(--gold);padding:8px 12px;border-radius:4px;margin:12px 0}
.skill ul,.skill ol{padding-left:1.2em;margin:.4em 0}
.skill li{margin:.3em 0}
table.mini{border-collapse:collapse;margin:10px 0;font-size:.92rem;width:100%}
table.mini th,table.mini td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
table.mini th{background:var(--blue-soft)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.prompt{font-size:1.08rem;font-weight:600;margin:.4em 0 .8em}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;background:#fff;border:2px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--blue)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--blue-soft);color:var(--blue-dark);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.85rem}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.ans{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.ans input[type=text]{flex:1 1 260px;font:inherit;font-family:Consolas,Menlo,monospace;padding:10px 12px;border:2px solid var(--line);border-radius:8px}
.ans input[type=text]:focus{outline:none;border-color:var(--blue)}
.fxbar{display:flex;align-items:center;gap:0;border:2px solid var(--line);border-radius:8px;background:#fff;flex:1 1 320px}
.fxbar:focus-within{border-color:var(--blue)}
.fxbar .fxl{padding:0 10px;font-style:italic;font-weight:700;color:var(--muted);border-right:1px solid var(--line);align-self:stretch;display:flex;align-items:center}
.fxbar input{border:0!important;flex:1;min-width:0;font-family:Consolas,Menlo,monospace;font-size:1rem;padding:10px 12px;background:transparent}
.fxbar input:focus{outline:none}
.fb{margin-top:12px;padding:10px 14px;border-radius:8px;border:1px solid}
.fb.ok{background:var(--good-soft);border-color:var(--good)}
.fb.no{background:var(--bad-soft);border-color:var(--bad)}
.fb.info{background:var(--blue-soft);border-color:var(--blue)}
.fb b.t{display:block}
code,.code{font-family:Consolas,Menlo,monospace;background:#EEF2F7;padding:1px 5px;border-radius:4px;font-size:.93em}
.xlwrap{overflow-x:auto;margin:8px 0 12px;max-width:100%}
table.xl{border-collapse:collapse;background:#fff;font-family:Calibri,Arial,sans-serif;font-size:13px}
table.xl th{background:#E9ECEF;border:1px solid #c7ccd1;color:#444;font-weight:600;padding:2px 8px;text-align:center;min-width:34px}
table.xl th.rh{width:30px;min-width:30px}
table.xl td{border:1px solid #d6d9dd;padding:3px 8px;height:23px;min-width:60px;white-space:nowrap;text-align:left}
table.xl td.n{text-align:right}
table.xl td.tgt{background:#FFF6CC;outline:2px solid #217346;outline-offset:-2px}
table.xl td.cp{background:#FFFBE8;outline:1.5px dashed #9AA7B5;outline-offset:-2px}
table.xl td.hl{background:#DDEBF7}
table.xl td.hl2{background:#FCE4D6}
table.xl td.act{outline:2px solid #217346;outline-offset:-2px;position:relative}

table.xl td.top{background:#BDD7EE;color:#1F3864}
table.xl td.bot{background:#FFEB9C}
.cap{font-size:.84rem;color:var(--muted);margin:2px 0 8px}
.xlwin{border:1px solid #b9c0c8;border-radius:6px;overflow:hidden;background:#fff;max-width:640px;font-family:Calibri,Arial,sans-serif;font-size:13px}
.xlwin .ttl{background:#217346;color:#fff;padding:5px 10px;display:flex;gap:10px;align-items:center}
.xlwin .rib{background:#f3f3f3;padding:4px 10px;display:flex;gap:14px;border-bottom:1px solid #ddd}

.xlwin .fb2{display:flex;gap:8px;align-items:center;padding:4px 8px;border-bottom:1px solid #ddd}
.xlwin .nb{border:1px solid #b9c0c8;padding:1px 10px;min-width:64px;background:#fff}
.xlwin .fc{flex:1;border:1px solid #d6d9dd;padding:1px 8px;font-family:Consolas,monospace}
.xlwin .bot{display:flex;gap:6px;padding:4px 8px;background:#f3f3f3;border-top:1px solid #ddd;align-items:center}
.xlwin .sh{padding:1px 10px;background:#fff;border:1px solid #ccc}
.xlwin .sh.on{color:#217346;font-weight:700;border-bottom:2px solid #217346}
.xlwin .zm{margin-left:auto}
.bd{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--blue);color:#fff;font-style:normal;font-size:11px;font-weight:700;margin:0 3px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2px 16px;margin:8px 0;font-size:.9rem}
.lab{display:grid;gap:10px;padding:14px;border:1px dashed var(--blue);border-radius:10px;background:#F8FBFE;margin:12px 0}
.lab label{font-size:.82rem;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.lab input[type=text]{font:inherit;font-family:Consolas,Menlo,monospace;padding:7px 10px;border:2px solid var(--line);border-radius:7px;width:100%}
.lab .grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
@media (max-width:560px){.lab .grid3{grid-template-columns:1fr}}
.res{font-family:Consolas,Menlo,monospace;font-size:1.05rem;padding:8px 12px;background:#fff;border:2px solid var(--blue);border-radius:8px}
.chip{display:inline-block;margin:2px 4px 2px 0;padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;font-family:Consolas,Menlo,monospace;font-size:.82rem;cursor:pointer}
.chip:hover{border-color:var(--blue)}
.ref-r{color:#1F6FB5;font-weight:700}.ref-a{color:#B03A2E;font-weight:700}.ref-m{color:#8E5A00;font-weight:700}
.svgrow{display:flex;flex-wrap:wrap;gap:14px}
.svgbox{flex:1 1 200px;text-align:center;font-size:.82rem;color:var(--muted)}
.svgbox svg{width:100%;max-width:230px;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
.nav-q{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue-dark)}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev:first-child{border-top:0}
.accent{height:4px;background:var(--gold);border-radius:3px;margin:10px 0 14px;width:70px}
.hide{display:none!important}
.sheetprint .card{break-inside:avoid}
@media print{
  header.top,nav.tabs,.noprint{display:none!important}
  body{background:#fff}
  main{max-width:none;padding:0}
  .card{border:1px solid #bbb;box-shadow:none}
}

<header class="top"><div class="in"><h1>IT 001 Introduction to Excel: Midterm Study Coach</h1><span class="sub">Hofstra University &middot; Zarb School of Business &middot; Modules 1 to 4</span><span class="sub" id="countdown" style="margin-left:auto;font-weight:700;color:#FFB81C"></span></div></header>

<script>
/* Mini spreadsheet engine: tokenize, parse, evaluate, translate (copy), grade by behavior. */
(function (root) {
  'use strict';
  function XlErr(code) { this.code = code; }
  XlErr.prototype.toString = function () { return this.code; };
  const isErr = (v) => v instanceof XlErr;

  function colToNum(s) { let n = 0; for (const ch of s.toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64); return n; }
  function numToCol(n) { let s = ''; while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; }
  function parseAddr(a) { const m = /^\$?([A-Za-z]{1,3})\$?(\d+)$/.exec(a); if (!m) return null; return { col: colToNum(m[1]), row: parseInt(m[2], 10) }; }
  function addrText(col, row) { return numToCol(col) + row; }

  const EPOCH = Date.UTC(1899, 11, 30);
  function dateSerial(y, m, d) { return Math.round((Date.UTC(y, m - 1, d) - EPOCH) / 86400000); }
  function serialToDate(n) { return new Date(EPOCH + Math.floor(n) * 86400000); }
  function fmtDate(n) { const d = serialToDate(n); return (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + '/' + d.getUTCFullYear(); }

  /* ---------- tokenizer ---------- */
  function tokenize(src) {
    const out = []; let i = 0;
    while (i < src.length) {
      const c = src[i];
      if (/\s/.test(c)) { i++; continue; }
      const rest = src.slice(i); let m;
      if ((m = /^"((?:[^"]|"")*)"/.exec(rest))) { out.push({ t: 'str', v: m[1].replace(/""/g, '"') }); i += m[0].length; continue; }
      if ((m = /^(\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?/.exec(rest))) { out.push({ t: 'num', v: parseFloat(m[0]) }); i += m[0].length; continue; }
      if ((m = /^(\$?)([A-Za-z]{1,3})(\$?)(\d+)(?![A-Za-z0-9_.(])/.exec(rest))) {
        out.push({ t: 'ref', ac: !!m[1], col: colToNum(m[2]), ar: !!m[3], row: parseInt(m[4], 10) });
        i += m[0].length; continue;
      }
      if ((m = /^[A-Za-z_][A-Za-z0-9_.]*/.exec(rest))) {
        const name = m[0].toUpperCase(); i += m[0].length;
        let j = i; while (src[j] === ' ') j++;
        if (src[j] === '(') { out.push({ t: 'fn', v: name }); i = j + 1; }
        else if (name === 'TRUE' || name === 'FALSE') out.push({ t: 'bool', v: name === 'TRUE' });
        else out.push({ t: 'name', v: name });
        continue;
      }
      if ((m = /^(<=|>=|<>)/.exec(rest))) { out.push({ t: 'op', v: m[0] }); i += 2; continue; }
      if ('+-*/^&=<>(),:%'.indexOf(c) >= 0) { out.push({ t: 'op', v: c }); i++; continue; }
      throw new XlErr('#CHAR');
    }
    return out;
  }

  /* ---------- parser ---------- */
  function parse(src) {
    const toks = tokenize(src); let p = 0;
    const peek = () => toks[p];
    const isOp = (v) => toks[p] && toks[p].t === 'op' && toks[p].v === v;
    function expect(v) { if (!isOp(v)) throw new XlErr('#SYNTAX'); p++; }
    function comparison() {
      let l = concat();
      while (peek() && peek().t === 'op' && ['=', '<>', '<', '>', '<=', '>='].indexOf(peek().v) >= 0) { const op = toks[p++].v; l = { k: 'bin', op, l, r: concat() }; }
      return l;
    }
    function concat() { let l = additive(); while (isOp('&')) { p++; l = { k: 'bin', op: '&', l, r: additive() }; } return l; }
    function additive() { let l = term(); while (isOp('+') || isOp('-')) { const op = toks[p++].v; l = { k: 'bin', op, l, r: term() }; } return l; }
    function term() { let l = power(); while (isOp('*') || isOp('/')) { const op = toks[p++].v; l = { k: 'bin', op, l, r: power() }; } return l; }
    function power() { let l = unary(); while (isOp('^')) { p++; l = { k: 'bin', op: '^', l, r: unary() }; } return l; }
    function unary() {
      if (isOp('-')) { p++; return { k: 'neg', e: unary() }; }
      if (isOp('+')) { p++; return unary(); }
      return postfix();
    }
    function postfix() { let e = primary(); while (isOp('%')) { p++; e = { k: 'bin', op: '/', l: e, r: { k: 'num', v: 100 } }; } return e; }
    function primary() {
      const t = peek(); if (!t) throw new XlErr('#SYNTAX');
      if (t.t === 'num') { p++; return { k: 'num', v: t.v }; }
      if (t.t === 'str') { p++; return { k: 'str', v: t.v }; }
      if (t.t === 'bool') { p++; return { k: 'bool', v: t.v }; }
      if (t.t === 'ref') {
        p++;
        if (isOp(':')) { p++; const t2 = peek(); if (!t2 || t2.t !== 'ref') throw new XlErr('#SYNTAX'); p++; return { k: 'range', a: t, b: t2 }; }
        return { k: 'ref', r: t };
      }
      if (t.t === 'fn') {
        p++; const args = [];
        if (isOp(')')) { p++; return { k: 'fn', name: t.v, args }; }
        for (;;) {
          if (isOp(',')) { args.push({ k: 'empty' }); p++; continue; }
          if (isOp(')')) { args.push({ k: 'empty' }); p++; break; }
          args.push(comparison());
          if (isOp(',')) { p++; if (isOp(')')) { args.push({ k: 'empty' }); p++; break; } continue; }
          if (isOp(')')) { p++; break; }
          throw new XlErr('#SYNTAX');
        }
        return { k: 'fn', name: t.v, args };
      }
      if (t.t === 'name') throw new XlErr('#NAME?');
      if (isOp('(')) { p++; const e = comparison(); expect(')'); return e; }
      throw new XlErr('#SYNTAX');
    }
    const ast = comparison();
    if (p < toks.length) throw new XlErr('#SYNTAX');
    return ast;
  }

  /* ---------- evaluation helpers ---------- */
  const isNum = (v) => typeof v === 'number' && isFinite(v);
  function toNum(v) {
    if (isErr(v)) throw v;
    if (v === null || v === undefined || v === '') return 0;
    if (typeof v === 'boolean') return v ? 1 : 0;
    if (typeof v === 'number') return v;
    if (typeof v === 'string') { const n = Number(v.trim()); if (v.trim() !== '' && isFinite(n)) return n; throw new XlErr('#VALUE!'); }
    throw new XlErr('#VALUE!');
  }
  function toStr(v) { if (isErr(v)) throw v; if (v === null || v === undefined) return ''; if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE'; return String(v); }
  function typeRank(v) { if (typeof v === 'number') return 1; if (typeof v === 'string') return 2; if (typeof v === 'boolean') return 3; return 0; }
  function compare(a, b) {
    if (isErr(a)) throw a; if (isErr(b)) throw b;
    if (a === null || a === undefined) a = (typeof b === 'string') ? '' : (typeof b === 'boolean' ? false : 0);
    if (b === null || b === undefined) b = (typeof a === 'string') ? '' : (typeof a === 'boolean' ? false : 0);
    const ra = typeRank(a), rb = typeRank(b);
    if (ra !== rb) return ra < rb ? -1 : 1;
    if (typeof a === 'string') { const x = a.toLowerCase(), y = b.toLowerCase(); return x < y ? -1 : x > y ? 1 : 0; }
    return a < b ? -1 : a > b ? 1 : 0;
  }
  const flat = (r) => [].concat.apply([], r);
  function shiftDec(x, d) { return Number(x + 'e' + d); }
  function roundHalfAway(x, d) { const s = x < 0 ? -1 : 1; return s * shiftDec(Math.round(shiftDec(Math.abs(x), d)), -d); }
  function roundUp(x, d) { const s = x < 0 ? -1 : 1; const v = shiftDec(Math.abs(x), d); const r = Math.abs(v - Math.round(v)) < 1e-9 ? Math.round(v) : Math.ceil(v); return s * shiftDec(r, -d); }
  function roundDown(x, d) { const s = x < 0 ? -1 : 1; const v = shiftDec(Math.abs(x), d); const r = Math.abs(v - Math.round(v)) < 1e-9 ? Math.round(v) : Math.floor(v); return s * shiftDec(r, -d); }
  const isWeekend = (serial) => { const d = serialToDate(serial).getUTCDay(); return d === 0 || d === 6; };

  function critMatch(cell, crit) {
    let op = '=', val = crit;
    if (typeof crit === 'string') {
      const m = /^(>=|<=|<>|>|<|=)(.*)$/.exec(crit);
      if (m) { op = m[1]; val = m[2]; }
      if (val !== '' && isFinite(Number(val))) val = Number(val);
    }
    if (cell === null || cell === undefined) { if (op === '=' && val === '') return true; return false; }
    if (typeof val === 'number' && typeof cell !== 'number') return op === '<>';
    if (typeof val === 'string' && typeof cell !== 'string') return op === '<>';
    const c = compare(cell, val);
    switch (op) { case '=': return c === 0; case '<>': return c !== 0; case '>': return c > 0; case '<': return c < 0; case '>=': return c >= 0; case '<=': return c <= 0; }
    return false;
  }

  function evaluate(ast, get) {
    function ev(n) {
      switch (n.k) {
        case 'num': case 'str': case 'bool': return n.v;
        case 'empty': return undefined;
        case 'ref': { if (n.r.row < 1 || n.r.col < 1) throw new XlErr('#REF!'); const v = get(n.r.col, n.r.row); return v === undefined ? null : v; }
        case 'range': {
          const c1 = Math.min(n.a.col, n.b.col), c2 = Math.max(n.a.col, n.b.col), r1 = Math.min(n.a.row, n.b.row), r2 = Math.max(n.a.row, n.b.row);
          if (r1 < 1 || c1 < 1) throw new XlErr('#REF!');
          const rows = []; for (let r = r1; r <= r2; r++) { const row = []; for (let c = c1; c <= c2; c++) { const v = get(c, r); row.push(v === undefined ? null : v); } rows.push(row); }
          return { rng: rows };
        }
        case 'neg': return -toNum(sc(ev(n.e)));
        case 'bin': {

topic('m1_workbook', 1, 'Workbooks, worksheets and saving', `
<ul>
<li><b>New workbook:</b> File tab, New, Blank workbook.</li>
<li><b>Plan first:</b> the goal or purpose, the types of data, the formulas you need, the appearance, and the audience.</li>
<li><b>Save As:</b> File, Save As lets you pick a format other than .xlsx.</li>
<li><b>Two sheet types:</b> a worksheet (rows and columns in a grid) and a chart sheet (a single chart linked to workbook data).</li>
<li><b>Sheet names:</b> up to 31 characters. Spaces and mixed case are allowed. Use names that show purpose.</li>
<li>Many workbooks include a <b>documentation worksheet</b> with a description, the date and the creator's name.</li>
<li>Delete a sheet by right clicking its tab and choosing Delete.</li>
</ul>`);
mc('m1_workbook', 'What is the maximum length of a worksheet name?', '31 characters', ['15 characters', '25 characters', '64 characters'], 'Sheet names cannot exceed 31 characters. They can include spaces and uppercase and lowercase letters.');
mc('m1_workbook', 'Which two types of sheets does Excel support?', 'Worksheets and chart sheets', ['Worksheets and template sheets', 'Data sheets and formula sheets', 'Chart sheets and print sheets'], 'A worksheet holds a grid of cells. A chart sheet holds a single chart linked to data in the workbook.');
mc('m1_workbook', 'Which item is NOT something you should define when planning a workbook?', 'The brand of computer you will use', ['The goal or purpose of the workbook', 'The audience', 'The formulas you must apply to the data'], 'Plan the goal, the data, the formulas, the appearance and the audience. The computer brand does not matter.');
mc('m1_workbook', 'What belongs on a documentation worksheet?', 'A description of the workbook, the date and the creator', ['Only the chart for the workbook', 'Print settings for each sheet', 'A list of keyboard shortcuts'], 'A documentation worksheet explains the workbook so others can understand it.');
mc('m1_workbook', 'How do you save a workbook in a format other than .xlsx?', 'File, Save As, then choose the format', ['Right click the sheet tab and choose Format', 'Home tab, then Save Format', 'Insert tab, then File Type'], 'Use Save As and pick the file format in the dialog box.');
mc('m1_workbook', 'What is the quickest way to delete a worksheet?', 'Right click its tab and choose Delete', ['Press Esc while the tab is selected', 'Drag the tab off the screen', 'Press Ctrl + Z'], 'The shortcut menu on the sheet tab includes Delete.');
mc('m1_workbook', 'A chart sheet contains', 'A single chart linked to data within the workbook', ['A grid of rows and columns for data entry', 'A list of formulas used in the workbook', 'Only the print settings'], 'Chart sheets hold one chart. Worksheets hold the grid of cells.');

topic('m1_select', 1, 'Cells, ranges and cell references', `
<ul>
<li>A <b>cell reference</b> names the column and row, such as B7.</li>
<li>A <b>range reference</b> names the cells in a block, such as A2:C6. The colon means "through."</li>
<li>Count a range by multiplying columns by rows. B2:D5 is 3 columns by 4 rows, so 12 cells.</li>
<li>A <b>nonadjacent range</b> is two or more separate blocks selected together, such as A5:B7, A9:B12.</li>
<li>Select adjacent column headings: click the first, hold Shift, click the last. You can also drag across the headings.</li>
<li>Use the scroll bars to move around the worksheet.</li>
</ul>`);
mc('m1_select', 'What is the reference of the cell where column D meets row 12?', 'D12', ['12D', 'D:12', 'R12C4'], 'Excel writes the column letter first, then the row number.');
mc('m1_select', 'Which range reference covers columns A through C in rows 2 through 6?', 'A2:C6', ['A2-C6', 'A2,C6', '2A:6C'], 'A range uses the upper left cell, a colon, then the lower right cell.');
nm('m1_select', 'How many cells are in the range B2:D5? (Type a number.)', null, '=3*4', 'B through D is 3 columns. Rows 2 through 5 is 4 rows. 3 times 4 is 12.');
nm('m1_select', 'How many cells are in the range A1:E10? (Type a number.)', null, '=5*10', '5 columns times 10 rows is 50 cells.');
mc('m1_select', 'To select a group of adjacent columns, you click the first column heading, hold down which key, and click the last column heading?', 'Shift', ['Alt', 'Tab', 'Esc'], 'Shift extends the selection to everything between the two clicks.');
mc('m1_select', 'What does the selection "A5:B7, A9:B12" represent?', 'Two separate ranges selected at the same time', ['One range from A5 to B12', 'A range with a formula in each cell', 'A range that has been merged'], 'A comma between ranges means they are separate. This is a nonadjacent selection.');

topic('m1_enter', 1, 'Entering and editing data', `
<ul>
<li><b>Text data:</b> any combination of letters, numbers and symbols. Examples: Dog, Mark, Apple Inc.</li>
<li><b>Numeric data:</b> values you can use in math. Examples: $100.00, 50, -125, 70%.</li>
<li><b>Dates and times</b> look like dates and times but are stored as numbers.</li>
<li><b>AutoComplete</b> suggests text that matches an earlier entry in the same column. Press Tab or Enter to accept it.</li>
<li><b>Undo</b> reverses actions from your current session. <b>Redo</b> brings them back.</li>
</ul>`);
mc('m1_enter', 'Which entry is numeric data?', '70%', ['Apple Inc.', 'Mark', 'Dog'], 'Percentages, currency amounts and plain numbers are numeric data. The others are text.');
mc('m1_enter', 'How does Excel store a date such as 4/6/2029?', 'As a number', ['As text', 'As a picture', 'As a formula'], 'Dates and times are stored as numbers. That is why you can subtract one date from another.');
mc('m1_enter', 'You type "Pr" in a column that already has "Product" in it, and Excel fills in "oduct." Which feature is this?', 'AutoComplete', ['Flash Fill', 'AutoSum', 'Format Painter'], 'AutoComplete matches what you type to earlier entries in the same column.');
mc('m1_enter', 'Which key(s) accept an AutoComplete suggestion?', 'Tab or Enter', ['Ctrl + Z', 'Esc', 'Shift + F4'], 'Press Tab or Enter to accept the suggested text.');
mc('m1_enter', 'What does the Undo button do?', 'Reverses actions you took during the current session', ['Deletes the entire worksheet', 'Saves the workbook in a new format', 'Clears all formatting from the workbook'], 'Excel keeps a list of your actions in the session. Undo steps backward through that list.');

topic('m1_size', 1, 'Resizing columns and rows, wrapping text', `
<ul>
<li>Default <b>column width</b> is 8.43 characters, which equals 64 pixels.</li>
<li>Default <b>row height</b> is 15 points, which equals 20 pixels. A point is about 1/72 of an inch.</li>
<li><b>AutoFit</b> sets a column width or row height to fit the widest or tallest entry.</li>
<li>To change several columns at once, select them first. Click the first heading, hold Shift, click the last. Or drag across the headings.</li>
<li>Set an exact size with Home, Cells group, Format, Row Height or Column Width.</li>
<li><b>Wrap Text:</b> Home tab, Alignment group. Long text moves to the next line inside the cell.</li>
<li>Start a new line inside a cell manually with <b>Alt + Enter</b>.</li>
</ul>`);
mc('m1_size', 'The default column width of 8.43 characters equals how many pixels?', '64 pixels', ['20 pixels', '15 pixels', '72 pixels'], 'Remember 8.43 characters equals 64 pixels.');
mc('m1_size', 'The default row height is 15 points. How many pixels is that?', '20 pixels', ['64 pixels', '15 pixels', '8 pixels'], 'The default row height is 15 points, which is 20 pixels.');
mc('m1_size', 'In what unit is row height measured?', 'Points', ['Characters', 'Inches only', 'Percent'], 'Row height is measured in points. Column width is measured in characters.');
mc('m1_size', 'Which keys start a new line inside a cell?', 'Alt + Enter', ['Ctrl + Enter', 'Shift + Tab', 'Ctrl + L'], 'Alt + Enter inserts a manual line break at the spot where the cursor sits.');
mc('m1_size', 'What does AutoFit do?', 'Adjusts a column width or row height to the widest or tallest entry', ['Shrinks the font so everything fits one page', 'Merges the selected cells', 'Locks the column so it cannot be resized'], 'AutoFit fits the column or row to its contents.');
mc('m1_size', 'Where is the Wrap Text button?', 'Home tab, Alignment group', ['Insert tab, Text group', 'Page Layout tab, Page Setup group', 'Data tab, Tools group'], 'Home, Alignment, Wrap Text.');
tx('m1_size', 'A point is about 1/___ of an inch. (Type the number.)', ['72'], 'Row heights are measured in points. There are about 72 points in an inch.');

topic('m1_formulas', 1, 'Formulas and order of operations', `
<ul>
<li>A <b>formula</b> is an expression that returns a value. It starts with <b>=</b>.</li>
<li>Operators: <b>+</b> add, <b>-</b> subtract, <b>*</b> multiply, <b>/</b> divide, <b>^</b> exponent.</li>
<li><b>Order of operations:</b> 1) parentheses, 2) exponents, 3) multiplication and division, 4) addition and subtraction. Equal steps go left to right.</li>
<li>When you <b>copy</b> a formula, it goes to the <b>Clipboard</b>. When you paste, Excel places it in the new spot.</li>
<li>The cell references in a copied formula change to match the new location. A formula in column C that adds cells in column C will point to column E if you paste it in column E.</li>
</ul>
<p class="tip">Exam tip: work these out on paper step by step. Parentheses first, then exponents.</p>`);
nm('m1_formulas', 'What value does =2+3*4 return?', null, '=2+3*4', 'Multiplication comes before addition. 3 times 4 is 12. Then 2 plus 12 is 14.');
nm('m1_formulas', 'What value does =(2+3)*4 return?', null, '=(2+3)*4', 'Parentheses first. 2 plus 3 is 5. Then 5 times 4 is 20.');
nm('m1_formulas', 'What value does =2*3^2 return?', null, '=2*3^2', 'Exponents come before multiplication. 3 squared is 9. Then 2 times 9 is 18.');
nm('m1_formulas', 'What value does =12/3*2 return?', null, '=12/3*2', 'Division and multiplication share a level, so go left to right. 12 divided by 3 is 4. Then 4 times 2 is 8.');
nm('m1_formulas', 'What value does =100-10*2+5 return?', null, '=100-10*2+5', 'Multiply first. 10 times 2 is 20. Then 100 minus 20 is 80. Then 80 plus 5 is 85.');
nm('m1_formulas', 'A1 holds 4 and B1 holds 2. What does =A1+B1*2 return?', { A1: 4, B1: 2 }, '=A1+B1*2', 'Multiply first. B1 times 2 is 4. Then A1 plus 4 is 8.');
nm('m1_formulas', 'A1 holds 4 and B1 holds 2. What does =(A1+B1)*2 return?', { A1: 4, B1: 2 }, '=(A1+B1)*2', 'The parentheses force the addition first. 4 plus 2 is 6. Then 6 times 2 is 12.');
nm('m1_formulas', 'What value does =10-4/2^2 return?', null, '=10-4/2^2', 'Exponent first: 2 squared is 4. Then 4 divided by 4 is 1. Then 10 minus 1 is 9.');
mc('m1_formulas', 'Which symbol is the exponentiation operator?', '^', ['*', '%', '&'], 'The caret ^ raises a number to a power. 2^3 is 8.');
mc('m1_formulas', 'What is the Clipboard?', 'A temporary storage area for items you copy or cut', ['A list of recently saved files', 'A toolbar with formatting buttons', 'A hidden worksheet'], 'When you copy, Excel places the formula on the Clipboard. When you paste, it retrieves it from there.');
mc('m1_formulas', 'Every formula in Excel begins with which character?', 'The equal sign (=)', ['The dollar sign ($)', 'The colon (:)', 'The plus sign (+) only'], 'Type = first so Excel knows you are entering a formula.');
fx('m1_formulas', 'Cells B2 and B3 hold a price and a quantity. B4 holds a tax rate (for example 0.08). In B6, write a formula for the total cost including tax: price times quantity times (1 plus the tax rate).', { grid: { A2: 'Price', B2: 25, A3: 'Quantity', B3: 4, A4: 'Tax rate', B4: 0.08 }, vary: { B2: [5, 90], B3: [1, 20], B4: [0.02, 0.12, 2] }, target: 'B6', ref: '=B2*B3*(1+B4)' }, 'Use parentheses so the addition happens before the multiplication: =B2*B3*(1+B4).', 'You need parentheses around 1+B4.');
fx('m1_formulas', 'B1 holds a starting amount, B2 holds an annual rate, and B3 holds a number of years. In B5, write a formula for the future value: the amount times (1 plus the rate) raised to the number of years.', { grid: { A1: 'Amount', B1: 1000, A2: 'Rate', B2: 0.05, A3: 'Years', B3: 3 }, vary: { B1: [500, 5000], B2: [0.01, 0.1, 2], B3: [1, 8] }, target: 'B5', ref: '=B1*(1+B2)^B3' }, '=B1*(1+B2)^B3. The exponent runs before the multiplication, and the parentheses make the addition run first.', 'Use ^ for the exponent.');

topic('m1_functions', 1, 'SUM, AVERAGE, COUNT, MAX and MIN', `
<ul>
<li>A <b>function</b> is a named operation that returns a value. <b>Syntax</b> is the set of rules for writing it.</li>
<li>An <b>argument</b> is the information the function uses. Required arguments come first. <b>Optional arguments sit in [brackets]</b> at the end.</li>
<li><b>AutoSum</b> is a quick way to enter SUM, AVERAGE, COUNT, MAX and MIN.</li>
</ul>
<table class="mini"><tr><th>Function</th><th>What it does</th></tr>
<tr><td>SUM</td><td>Adds the values in a range</td></tr>
<tr><td>AVERAGE</td><td>Averages the values in a range</td></tr>
<tr><td>COUNT</td><td>Counts the <b>numeric</b> values</td></tr>
<tr><td>COUNTA</td><td>Counts all cells that are <b>not empty</b></td></tr>
<tr><td>COUNTBLANK</td><td>Counts <b>blank</b> cells</td></tr>
<tr><td>MAX / MIN</td><td>Largest and smallest value</td></tr></table>
<p class="tip">Exam tip: COUNT skips text. COUNTA counts text and numbers. COUNTBLANK counts the empty cells.</p>`, 'countfns');
mc('m1_functions', 'Which function counts only the cells that contain numbers?', 'COUNT', ['COUNTA', 'COUNTBLANK', 'SUM'], 'COUNT counts numeric values. COUNTA counts every cell that is not empty.');
mc('m1_functions', 'Which function counts all cells that are not empty, including text?', 'COUNTA', ['COUNT', 'COUNTBLANK', 'MAX'], 'COUNTA counts anything in the cell, text or numbers.');
mc('m1_functions', 'Which function counts the blank cells in a range?', 'COUNTBLANK', ['COUNT', 'COUNTA', 'MIN'], 'COUNTBLANK counts empty cells.');
mc('m1_functions', 'In function syntax, how are optional arguments shown?', 'Inside brackets []', ['Inside quotation marks', 'In bold type', 'After a dollar sign'], 'COUNT(value1,[value2],...) shows value2 as optional because of the brackets.');
mc('m1_functions', 'Which function is NOT one of the quick AutoSum choices?', 'VLOOKUP', ['AVERAGE', 'MAX', 'COUNT'], 'AutoSum offers SUM, AVERAGE, COUNT, MAX and MIN.');
const cg = { A1: 10, A2: 20, A3: 'N/A', A4: 30 };
nm('m1_functions', 'Range A1:A5 holds 10, 20, the text "N/A", 30, and a blank cell. What does =COUNT(A1:A5) return?', cg, '=COUNT(A1:A5)', 'COUNT counts only the numbers: 10, 20 and 30. The answer is 3.');
nm('m1_functions', 'Same range: 10, 20, "N/A", 30, blank. What does =COUNTA(A1:A5) return?', cg, '=COUNTA(A1:A5)', 'COUNTA counts every cell that is not empty: 10, 20, "N/A" and 30. The answer is 4.');
nm('m1_functions', 'Same range: 10, 20, "N/A", 30, blank. What does =COUNTBLANK(A1:A5) return?', cg, '=COUNTBLANK(A1:A5)', 'Only A5 is empty. The answer is 1.');
nm('m1_functions', 'Cells B2:B6 hold 4, 8, 6, 2, 10. What does =MAX(B2:B6)-MIN(B2:B6) return?', { B2: 4, B3: 8, B4: 6, B5: 2, B6: 10 }, '=MAX(B2:B6)-MIN(B2:B6)', 'MAX is 10 and MIN is 2. 10 minus 2 is 8.');
fx('m1_functions', 'Row 2 shows North region sales for Q1 through Q4 in B2:E2. In F2, write a formula for the annual total. Make it work when you copy it down to F3 and F4.', { grid: { A1: 'Region', B1: 'Q1', C1: 'Q2', D1: 'Q3', E1: 'Q4', F1: 'Total', A2: 'North', B2: 120, C2: 95, D2: 140, E2: 160, A3: 'South', B3: 80, C3: 110, D3: 90, E3: 100, A4: 'East', B4: 75, C4: 60, D4: 85, E4: 70 }, vary: { B2: [50, 200], C2: [50, 200], D2: [50, 200], E2: [50, 200], B3: [50, 200], C3: [50, 200], D3: [50, 200], E3: [50, 200], B4: [50, 200], C4: [50, 200], D4: [50, 200], E4: [50, 200] }, target: 'F2', copy: ['F3', 'F4'], ref: '=SUM(B2:E2)' }, '=SUM(B2:E2) copies down correctly because the references are relative.', 'Use the SUM function with a range.');
fx('m1_functions', 'Test scores are in B2:B7. In B9, write a formula for the average score.', { grid: { A1: 'Student', B1: 'Score', A2: 'Ana', B2: 88, A3: 'Ben', B3: 92, A4: 'Cy', B4: 75, A5: 'Dee', B5: 81, A6: 'Eli', B6: 69, A7: 'Fay', B7: 95 }, vary: { B2: [40, 100], B3: [40, 100], B4: [40, 100], B5: [40, 100], B6: [40, 100], B7: [40, 100] }, target: 'B9', ref: '=AVERAGE(B2:B7)' }, '=AVERAGE(B2:B7).');
fx('m1_functions', 'Daily sales are in B2:B8. In B10, write a formula for the spread between the best day and the worst day (largest minus smallest).', { grid: { A1: 'Day', B1: 'Sales', B2: 310, B3: 280, B4: 455, B5: 390, B6: 205, B7: 520, B8: 340 }, vary: { B2: [100, 600], B3: [100, 600], B4: [100, 600], B5: [100, 600], B6: [100, 600], B7: [100, 600], B8: [100, 600] }, target: 'B10', ref: '=MAX(B2:B8)-MIN(B2:B8)' }, '=MAX(B2:B8)-MIN(B2:B8).');
fx('m1_functions', 'Column A lists customer names, and some rows are blank. In D2, write a formula that counts how many cells in A2:A9 are NOT empty.', { grid: { A1: 'Customer', A2: 'Lee', A3: 'Park', A5: 'Ruiz', A6: 'Shah', A8: 'Tran' }, target: 'D2', ref: '=COUNTA(A2:A9)' }, '=COUNTA(A2:A9). COUNT would return 0 because the entries are text.', 'Which function counts text?');
fx('m1_functions', 'Miles driven are in B2:B6 and gallons used are in C2:C6. In B8, write a formula for miles per gallon: total miles divided by total gallons.', { grid: { A1: 'Trip', B1: 'Miles', C1: 'Gallons', B2: 233, C2: 43, B3: 277, C3: 98, B4: 360, C4: 65, B5: 180, C5: 32, B6: 303, C6: 54 }, vary: { B2: [100, 400], B3: [100, 400], B4: [100, 400], B5: [100, 400], B6: [100, 400], C2: [20, 100], C3: [20, 100], C4: [20, 100], C5: [20, 100], C6: [20, 100] }, target: 'B8', ref: '=SUM(B2:B6)/SUM(C2:C6)' }, '=SUM(B2:B6)/SUM(C2:C6). Add up each column first, then divide.');

topic('m1_viewprint', 1, 'Formula view, page views and printing', `
<ul>
<li><b>Formula view</b> shows formulas in place of results. If you print in formula view, the printout shows formulas.</li>
<li>When printing formulas, also print <b>gridlines</b> and <b>row and column headings</b>. Then the cell references are easy to find.</li>
<li><b>Three views:</b> Normal, Page Layout and Page Break Preview.</li>
<li><b>Orientation:</b> portrait is taller than wide. Landscape is wider than tall.</li>
<li><b>Scaling</b> (Page Layout, Scale to Fit) shrinks the sheet to fit one page or a set of pages.</li>
<li><b>Print screen</b> sits in Backstage view. Shortcut: <b>Ctrl + P</b>. Choose the printer, copies and what to print.</li>
<li>The <b>Quick Access toolbar</b> sits at the upper left. You can add your favorite commands to it.</li>
</ul>`);
mc('m1_viewprint', 'Why print gridlines and row and column headings when you print a sheet in formula view?', 'So the cell references in the formulas are easy to locate', ['So the sheet prints in color', 'So formulas calculate faster', 'So the page breaks disappear'], 'Formulas refer to cells like B7. Headings and gridlines let readers find them.');
mc('m1_viewprint', 'Which list shows the three ways to view a workbook?', 'Normal, Page Layout, Page Break Preview', ['Normal, Draft, Final', 'Formula, Value, Chart', 'Screen, Print, Reading'], 'Normal, Page Layout and Page Break Preview.');
mc('m1_viewprint', 'Which page orientation is wider than it is tall?', 'Landscape', ['Portrait', 'Scaled', 'Vertical'], 'Landscape is wider than tall. Portrait is taller than wide.');
tx('m1_viewprint', 'What keyboard shortcut opens the Print screen on Windows?', ['Ctrl+P', 'Ctrl + P', 'control p', 'ctrl p'], 'Ctrl + P opens the Print screen in Backstage view.');
mc('m1_viewprint', 'What does scaling do for a printed worksheet?', 'Resizes the worksheet to fit within one page or a set of pages', ['Changes the font in every cell', 'Locks the rows and columns', 'Adds a header and footer'], 'Page Layout, Scale to Fit has several scaling choices.');
mc('m1_viewprint', 'Where is the Quick Access toolbar?', 'At the upper left of the worksheet window', ['At the bottom of the window next to the sheet tabs', 'On the Insert tab', 'Inside the formula bar'], 'The Quick Access toolbar is at the upper left. You can set frequently used commands there.');

topic('m1_move', 1, 'Move, copy, insert, delete and clear', `
<ul>
<li><b>Drag and drop:</b> select the cells, point to the bottom border of the selection, drag to the new spot and release.</li>
<li>You can also right click, choose Copy, and paste. With formulas, references that are not absolute may change when you paste.</li>
<li><b>Insert a row:</b> existing rows shift <b>down</b>. The new row has the same height as the row above.</li>
<li><b>Insert a column:</b> existing columns shift <b>right</b>. The new column has the same width as the column to its left.</li>
<li><b>Insert cells:</b> you choose to shift cells right or down.</li>
<li><b>Insert a range:</b> by default cells shift right when the selected range is longer than wide, and down when it is wider than long.</li>
<li><b>Delete</b> removes the data <b>and</b> the cells. <b>Clear</b> removes the data but keeps the cells and the worksheet structure.</li>
</ul>`);
mc('m1_move', 'When you insert a new row, what happens to the existing rows?', 'They shift down', ['They shift up', 'They shift right', 'They are deleted'], 'Existing rows move down. The new row takes the height of the row above it.');
mc('m1_move', 'When you insert a new column, what happens to the existing columns?', 'They shift to the right', ['They shift to the left', 'They shift down', 'They are cleared'], 'Existing columns move right. The new column takes the width of the column to its left.');
mc('m1_move', 'Which command removes the data from cells but leaves the cells and the worksheet structure in place?', 'Clear', ['Delete', 'Insert', 'Merge'], 'Clear removes the data. Delete removes the data and the cells themselves.');
mc('m1_move', 'What is "drag and drop" in Excel?', 'Selecting cells and dragging them by the border to a new location', ['Copying a format to another range', 'Filling a series with the fill handle', 'Moving a chart to a chart sheet'], 'Point to the bottom border of the selection, drag, and release to move the cells.');
mc('m1_move', 'You insert a new row. How tall is it?', 'The same height as the row above it', ['The default height of 15 points always', 'The same height as the row below it', 'It has no height until you set one'], 'A new row copies the height of the row above. A new column copies the width of the column to its left.');
mc('m1_move', 'When you insert a range, in which direction do cells shift by default when the selected range is wider than it is tall?', 'Down', ['Right', 'Up', 'Left'], 'The default shifts cells down when the range is wider than it is long. You can choose a different direction with the Insert command.');

topic('m1_flash', 1, 'Flash Fill, borders and font size', `
<ul>
<li><b>Flash Fill</b> enters text based on a pattern it finds in the rows above, in the same columns of data.</li>
<li>Example: column A has "Mark Garman." You type "Garman, Mark" in B2. Flash Fill can finish the rest of column B in the same pattern.</li>
<li><b>Borders</b> around cells make content easier to read.</li>
<li><b>Font size</b> helps readers tell a title or section heading from the data.</li>
</ul>`);
mc('m1_flash', 'What does Flash Fill do?', 'Enters text based on a pattern it finds in earlier rows of the same columns', ['Copies a formula down a column', 'Converts text to numbers', 'Adds a border to every cell'], 'Flash Fill recognizes the pattern you started and completes the rest.');
mc('m1_flash', 'Column A lists full names such as "Ava Chen." You type "Chen, Ava" in B2 and start the next row. What does Flash Fill do?', 'It offers to fill the rest of column B using the same pattern', ['It sorts column A', 'It deletes column A', 'It formats column B as a date'], 'You show the pattern once or twice and Flash Fill suggests the rest.');
mc('m1_flash', 'Why would you change the font size of a heading?', 'To distinguish a title or section heading from the data', ['To make the formula calculate again', 'To protect the cell', 'To add a border'], 'Different sizes show structure on the page.');
mc('m1_flash', 'Why add borders around worksheet cells?', 'To make worksheet content easier to read', ['To lock the cells from editing', 'To change the number format', 'To reduce file size'], 'Borders organize and separate content.');

/* ===================== MODULE 2 ===================== */
topic('m2_font', 2, 'Fonts, colors, fills and sheet tabs', `
<ul>
<li>A well-formatted workbook makes data easier to analyze. A poorly formatted one can hide useful information.</li>
<li><b>Fonts</b> are sets of characters that share a common appearance and shape. You can change font, style, size and color.</li>
<li><b>Standard colors</b> are always available. There are <b>10</b>: dark red, red, orange, yellow, light green, green, light blue, blue, dark blue and purple. You can also create custom colors.</li>
<li>The <b>Mini toolbar</b> is a small toolbar next to selected content. It holds the most common formatting commands.</li>
<li><b>Live Preview</b> lets you try a format before you apply it.</li>
<li><b>Fill color</b> is the cell background. It highlights data and separates parts of a sheet. To fill the whole sheet, select all cells (Select All button or <b>Ctrl + A</b>) and then choose the fill.</li>
<li><b>Sheet tab color:</b> group related sheets by tab color. You can change the tab fill but not the tab text color or style.</li>
</ul>`);
mc('m2_font', 'How many standard colors does Excel offer?', '10', ['6', '12', '16'], 'The standard colors are dark red, red, orange, yellow, light green, green, light blue, blue, dark blue and purple.');
mc('m2_font', 'What is the Mini toolbar?', 'A small toolbar next to selected content with the most common formatting commands', ['A toolbar that holds the Quick Access commands', 'A button that prints a selection', 'The formula bar when a sheet is zoomed out'], 'The Mini toolbar appears next to your selection so you can format quickly.');
mc('m2_font', 'What does Live Preview do?', 'Lets you test a formatting option before you apply it', ['Shows how the sheet looks when printed', 'Updates charts as data changes', 'Saves a copy of the sheet'], 'Point to a choice in a gallery and Excel previews it on your selection.');
mc('m2_font', 'How do you select every cell on a worksheet?', 'Click the Select All button or press Ctrl + A', ['Press Ctrl + Z', 'Double click a column heading', 'Press Alt + Enter'], 'Select all, then change the fill color to color the entire worksheet background.');
mc('m2_font', 'Which part of a sheet tab can you NOT change?', 'The tab text color and style', ['The tab fill color', 'The tab name', 'The tab position'], 'You can color the tab fill to group sheets, but the text color and style stay fixed.');
mc('m2_font', 'Why would you use a fill color in a report?', 'To highlight data or separate parts of the worksheet', ['To change the numeric value of a cell', 'To shorten the formulas', 'To set the print area'], 'Fill colors draw the eye and organize the sheet.');

topic('m2_numfmt', 2, 'Number formats: Currency, Accounting, Percent, Dates', `
<ul>
<li>All cells start in the <b>General</b> format. It shows the value with no symbols or commas.</li>
<li>Pick a format: select the cell, right click, Format Cells, Number tab.</li>
<li><b>Accounting:</b> currency symbol at the <b>left edge</b> of the cell. Negatives in <b>parentheses</b>. Zero shows as a <b>dash</b>.</li>
<li><b>Currency:</b> symbol sits <b>right next to the first digit</b>. Negatives show a <b>minus sign</b>.</li>
<li><b>Percent Style</b> button formats as a percentage with no decimal places. 0.25 shows as 25%.</li>
<li>Dates and times are stored as numbers. A format changes the look, not the stored value.</li>
<li><b>Short Date:</b> mm/dd/yyyy. <b>Long Date:</b> includes the day of the week and the full month name.</li>
<li>Other built-in formats: Time (12 hour), Fraction, Scientific, Text.</li>
</ul>`, 'numfmt');
mc('m2_numfmt', 'Which format places the dollar sign at the left edge of the cell?', 'Accounting', ['Currency', 'General', 'Percent'], 'Accounting lines up the symbol at the left edge. Currency places it next to the first digit.');
mc('m2_numfmt', 'Which format shows a negative number with a minus sign and the dollar sign right beside the first digit?', 'Currency', ['Accounting', 'Fraction', 'Scientific'], 'Currency shows -$200.00. Accounting shows ($200.00) with the symbol at the left edge.');
mc('m2_numfmt', 'How does the Accounting format display a negative number?', 'In parentheses', ['With a minus sign in front', 'In red only', 'With the word negative'], 'Accounting shows negatives in parentheses.');
mc('m2_numfmt', 'How does the Accounting format display a zero?', 'As a dash', ['As 0.00', 'As a blank cell', 'As the word zero'], 'Accounting shows zero values as a dash.');
mc('m2_numfmt', 'The Percent Style button is applied to a cell holding 0.25. What shows in the cell?', '25%', ['0.25%', '2.5%', '250%'], 'Percent Style multiplies by 100 for display and adds the percent sign.');
mc('m2_numfmt', 'What is the default number format for a new cell?', 'General', ['Number', 'Currency', 'Text'], 'All cells start out in General. It adds no symbols or commas.');
mc('m2_numfmt', 'What does the Short Date format look like?', 'mm/dd/yyyy', ['Day of week, full month, day, year', 'dd-mmm', 'hh:mm AM/PM'], 'Short Date is mm/dd/yyyy. Long Date adds the weekday and spells out the month.');
mc('m2_numfmt', 'What does the Long Date format display that Short Date does not?', 'The day of the week and the full month name', ['The time of day', 'The week number', 'A two digit year'], 'Example: Friday, April 6, 2029.');
mc('m2_numfmt', 'You change a date from Short Date to Long Date. What changes?', 'Only how it looks. The stored number stays the same', ['The stored value', 'The date moves to a new cell', 'The date becomes text'], 'Dates are stored as numbers. Formats change the display, not the value.');
mc('m2_numfmt', 'Which built-in number format shows 0.75 as 3/4?', 'Fraction', ['Scientific', 'Accounting', 'Time'], 'Fraction displays decimals as fractions.');
mc('m2_numfmt', 'A cell holds -200 and is formatted as Accounting. Which display is correct?', '$ (200.00) with the $ at the far left of the cell', ['-$200.00 with the $ touching the 2', '200.00-', '$-200'], 'Accounting uses parentheses and keeps the symbol at the left edge.');
fx('m2_numfmt', 'Total revenue is in B5, total expenses are in B6, and net profit is in B7. In B8, write the profit margin: net profit divided by total revenue.', { grid: { A5: 'Total Revenue', B5: 480000, A6: 'Total Expenses', B6: 395000, A7: 'Net Profit/Loss', B7: 85000 }, vary: { B5: [200000, 900000], B6: [100000, 700000], B7: [20000, 200000] }, target: 'B8', ref: '=B7/B5' }, 'Profit margin is net profit divided by revenue: =B7/B5. Then format B8 as a percentage.', 'Use the net profit cell and the revenue cell.');

topic('m2_painter', 2, 'Format Painter, Paste Special and Transpose', `
<ul>
<li><b>Format Painter</b> (Home, Clipboard) copies formatting from one cell or range to another.</li>
<li>The cells with the formatting you want are the <b>source range</b>. The cells that receive it are the <b>destination range</b>. The format repeats until the whole destination is formatted.</li>
<li><b>Paste Options</b> button: paste values only, formats only, or both.</li>
<li><b>Paste Special</b> gives more control. Copy, then use the Paste arrow or right click, Paste Special.</li>
<li><b>Transpose</b> swaps rows and columns. Use Paste Special, Transpose, or the TRANSPOSE function (Formulas, Lookup and Reference).</li>
<li>Clearing formats removes the formatting and keeps the data.</li>
</ul>`);
mc('m2_painter', 'What does the Format Painter do?', 'Copies formatting from one cell or range to another', ['Copies formulas and values only', 'Paints the sheet tab', 'Clears all formatting in the workbook'], 'Use it on the Home tab, Clipboard group.');
mc('m2_painter', 'In formatting terms, what is a source range?', 'The cells that have the formatting you want to copy', ['The cells that receive the format', 'The range that holds formulas', 'The range shown in a chart'], 'The cells that receive the format are the destination range.');
mc('m2_painter', 'Which tool changes the orientation of data, switching rows for columns and columns for rows?', 'Transpose', ['Merge Cells', 'AutoFit', 'Flash Fill'], 'Transpose is an option in Paste Special. The TRANSPOSE function also does it.');
mc('m2_painter', 'The Paste Options button lets you paste', 'Values only, formats only, or a combination', ['Only the formulas', 'Only the borders', 'Only the sheet name'], 'Paste Special gives more detailed control.');
mc('m2_painter', 'Where do you find the TRANSPOSE function?', 'Formulas tab, Lookup and Reference', ['Home tab, Font group', 'Page Layout tab, Margins', 'Insert tab, Charts'], 'Formulas, Lookup and Reference includes TRANSPOSE.');
mc('m2_painter', 'You clear the formatting from a cell that holds 500. What happens?', 'The 500 stays and the formatting is removed', ['The 500 is deleted', 'The cell is deleted and others shift', 'The formula in the cell is changed to text'], 'Clearing formats removes only the format.');

topic('m2_align', 2, 'Borders, alignment, merge, rotate and Format Cells', `
<ul>
<li><b>Accounting borders:</b> underline subtotals with a single line and grand totals with a double underline. Border styles can change color, thickness and placement.</li>
<li><b>Default alignment:</b> text aligns left, numbers align right, both aligned to the bottom of the cell.</li>
<li><b>Good practice:</b> center column titles, left align other text, right align numbers so decimals line up.</li>
<li><b>Indent</b> adds space between content and the cell border.</li>
<li><b>Merge</b> combines a range into one cell. Only the <b>upper left</b> cell content is kept. The merged cell reference is the upper left cell.</li>
<li><b>Merge &amp; Center:</b> merges and centers. <b>Merge Across:</b> merges each row across the columns. <b>Merge Cells:</b> merges without centering. <b>Unmerge Cells:</b> reverses it.</li>
<li><b>Rotate text</b> to any angle to save space or add interest (Format Cells, Alignment).</li>
<li><b>Format Cells dialog:</b> six tabs: Number, Alignment, Font, Border, Fill, Protection. Open it from Home, Cells, Format, or right click.</li>
</ul>`, 'merge');
mc('m2_align', 'When you merge a range of cells with data in several of them, which content is kept?', 'Only the content of the upper left cell', ['All of the content joined together', 'Only the content of the lower right cell', 'The largest number'], 'Only the upper left value survives the merge.');
mc('m2_align', 'You merge the range A1:C1. What is the cell reference of the merged cell?', 'A1', ['C1', 'A1:C1', 'B1'], 'A merged range takes the reference of its upper left cell.');
mc('m2_align', 'How many tabs are in the Format Cells dialog box?', 'Six', ['Three', 'Four', 'Eight'], 'Number, Alignment, Font, Border, Fill and Protection.');
mc('m2_align', 'Which is NOT a tab in the Format Cells dialog box?', 'Chart', ['Protection', 'Alignment', 'Border'], 'The six tabs are Number, Alignment, Font, Border, Fill and Protection.');
mc('m2_align', 'Which border style is standard accounting practice for a grand total?', 'A double underline', ['A dotted outline', 'A thick red box', 'No border'], 'Single underline for subtotals and double underline for grand totals.');
mc('m2_align', 'By default, how does Excel align numbers horizontally?', 'To the right edge of the cell', ['To the left edge', 'In the center', 'Justified'], 'Text aligns left and numbers align right.');
mc('m2_align', 'What is the recommended alignment for column titles?', 'Centered', ['Left aligned', 'Right aligned', 'Rotated 90 degrees'], 'Center column titles, left align other text and right align numbers.');
mc('m2_align', 'Which merge option merges each row of the selection across its columns?', 'Merge Across', ['Merge & Center', 'Merge Cells', 'Unmerge Cells'], 'Merge Across keeps rows separate and merges across the columns of each row.');
mc('m2_align', 'Which option merges the selected range into one cell WITHOUT centering the content?', 'Merge Cells', ['Merge & Center', 'Merge Across', 'Unmerge Cells'], 'Merge & Center merges and centers. Merge Cells only merges.');
mc('m2_align', 'What does indenting do?', 'Adds space between the cell content and the cell border', ['Merges two cells', 'Changes the number format', 'Rotates the text'], 'Increase indent moves content away from the border. Decrease moves it closer.');

topic('m2_find', 2, 'Find and Replace, and AVERAGE', `
<ul>
<li><b>Find and Replace</b> (Home, Editing, magnifying glass) makes global changes. It searches the selection, the worksheet or the whole workbook.</li>
<li>The search can use <b>text, numbers, formats</b>, or a mix.</li>
<li>When a match is found, you can replace the <b>contents</b> or the <b>formats</b>.</li>
<li><b>AVERAGE</b> calculates the average of a collection of numbers. Syntax: <b>AVERAGE(number1,[number2],[number3],...)</b>.</li>
</ul>`);
mc('m2_find', 'Find and Replace can search within', 'The selection, the worksheet or the entire workbook', ['The selection only', 'One cell at a time', 'Only the formula bar'], 'Pick the scope in the dialog box.');
mc('m2_find', 'Find and Replace criteria can be based on', 'Text, numbers, formats, or a combination', ['Text only', 'Numbers only', 'Formulas only'], 'You can even find a format and replace it with another.');
mc('m2_find', 'Where is the Find and Replace button?', 'Home tab, Editing group (magnifying glass)', ['Insert tab, Illustrations group', 'Page Layout tab, Page Setup group', 'Data tab, Get and Transform group'], 'Home, Editing.');
mc('m2_find', 'Which is the correct syntax for the AVERAGE function?', 'AVERAGE(number1,[number2],[number3],...)', ['AVERAGE(range,criteria)', 'AVERAGE(lookup_value,table,column)', 'AVERAGE(text,num_chars)'], 'Number1 is required. The rest are optional.');
nm('m2_find', 'Cells B2:B5 hold 80, 90, 70, 100. What does =AVERAGE(B2:B5) return?', { B2: 80, B3: 90, B4: 70, B5: 100 }, '=AVERAGE(B2:B5)', 'The sum is 340. Divided by 4 values gives 85.');
fx('m2_find', 'Monthly sales are in D12:O12. In P12 write a formula for the average monthly sales.', { grid: { D12: 120, E12: 95, F12: 131, G12: 134, H12: 141, I12: 144, J12: 151, K12: 139, L12: 122, M12: 123, N12: 136, O12: 149 }, vary: { D12: [80, 200], E12: [80, 200], F12: [80, 200], G12: [80, 200], H12: [80, 200], I12: [80, 200], J12: [80, 200], K12: [80, 200], L12: [80, 200], M12: [80, 200], N12: [80, 200], O12: [80, 200] }, target: 'P12', ref: '=AVERAGE(D12:O12)' }, '=AVERAGE(D12:O12).');

topic('m2_cf', 2, 'Conditional formatting', `
<ul>
<li>A <b>conditional format</b> depends on the cell's content. When the content changes, the format can change.</li>
<li>Four types: <b>data bars, highlighting, color scales, icon sets</b>.</li>
<li><b>Steps:</b> select the range, Home tab, Styles group, Conditional Formatting, choose Highlight Cells Rules or Top/Bottom Rules, set the options, OK.</li>
<li><b>Top/Bottom rule</b> formats the highest or lowest numbers. Example from class: top 10% in light blue fill with dark blue font. Bottom 10% in yellow fill with the automatic font.</li>
<li>You can <b>edit</b> a rule to change what is highlighted or the format used.</li>
<li><b>Document</b> your rules with a legend or a documentation page so readers know why cells look different.</li>
<li>To remove: select the range, Conditional Formatting, <b>Clear Rules</b>, from the selected cells or the entire worksheet. The data is not affected.</li>
</ul>`, 'condfmt');
mc('m2_cf', 'Which is NOT one of the four types of conditional formats in Excel?', 'Pivot formats', ['Data bars', 'Color scales', 'Icon sets'], 'The four types are data bars, highlighting, color scales and icon sets.');
mc('m2_cf', 'Where is the Conditional Formatting button?', 'Home tab, Styles group', ['Insert tab, Charts group', 'Page Layout tab, Margins group', 'Data tab, Tools group'], 'Home, Styles, Conditional Formatting.');
mc('m2_cf', 'What does a Top 10% rule do?', 'Formats the cells with the highest values in the selected range', ['Formats the first ten cells in the range', 'Deletes the lowest ten cells', 'Sorts the range from high to low'], 'Top/Bottom rules look at values, not positions.');
mc('m2_cf', 'A cell with a conditional format changes value. What happens to its format?', 'It can change automatically in response to the new value', ['It stays the same until you clear the rule', 'The workbook asks you to reapply the rule', 'The rule is deleted'], 'Conditional formats respond to cell content.');
mc('m2_cf', 'What is a good way to document the conditional formats used in a workbook?', 'A legend or a documentation page', ['A hidden column', 'A password', 'A page break'], 'Readers need to know why some cells are formatted differently.');
mc('m2_cf', 'What happens to the data when you clear a conditional format rule?', 'Nothing. The data is not affected', ['The data in the range is deleted', 'The data is converted to text', 'The data is sorted'], 'Clear Rules removes the formatting only.');
mc('m2_cf', 'When you clear rules, which scopes can you choose?', 'The selected cells or the entire worksheet', ['Only one cell', 'The whole computer', 'Only the current column'], 'The Clear Rules menu offers selected cells or the entire worksheet.');

topic('m2_print', 2, 'Designing a printed worksheet', `
<ul>
<li>The <b>Page Layout</b> tab: orientation, print area, page breaks, headers and footers. Settings can apply to the whole workbook or to one sheet.</li>
<li><b>Page Break Preview</b> shows how many pages will print and what lands on each page.</li>
<li><b>Print area:</b> highlight the range, then Set Print Area. Only that range prints.</li>
<li><b>Print titles:</b> rows and columns that repeat on every page, which adds context to each printed page.</li>
<li><b>Page breaks:</b> Excel adds automatic breaks. They can split a table at an awkward spot. Add manual breaks to fix this. A manual break is set at the <b>upper left corner of the selected cell</b>.</li>
<li><b>Header</b> is text at the top of a printed page. <b>Footer</b> is text at the bottom. Each has three sections: left, center and right. They can be dynamic: sheet name, page number, total pages, date printed.</li>
<li>Headers and footers appear <b>only on printed pages</b>.</li>
<li><b>Margins:</b> default is 0.7 inch left and right, 0.75 inch top and bottom, and 0.3 inch around the header and footer.</li>
</ul>`);
mc('m2_print', 'What are the default left and right page margins?', '0.7 inch', ['1 inch', '0.5 inch', '0.3 inch'], 'Left and right 0.7. Top and bottom 0.75. Header and footer 0.3.');
mc('m2_print', 'What are the default top and bottom page margins?', '0.75 inch', ['0.7 inch', '1.25 inches', '0.3 inch'], 'Top and bottom are 0.75 inch. Left and right are 0.7 inch.');
mc('m2_print', 'What does Page Break Preview show?', 'How many pages will print and what will print on each page', ['The formulas in each cell', 'Only the chart elements', 'The workbook properties'], 'Use it before you print.');
mc('m2_print', 'What are print titles?', 'Rows and columns that repeat on every printed page', ['The name of the workbook file', 'The title text in a chart', 'The sheet tab labels'], 'Print titles give context to every page.');
mc('m2_print', 'Into how many sections is a header or footer divided?', 'Three: left, center and right', ['Two: top and bottom', 'Four', 'One'], 'You can enter information in each section.');
mc('m2_print', 'Where does Excel place a manual page break?', 'At the upper left corner of the selected cell', ['At the lower right corner of the selected cell', 'After the last used row', 'At the center of the sheet'], 'Select the cell first. The break goes above and to the left of it.');
mc('m2_print', 'Where do headers and footers appear?', 'Only on printed pages', ['On the worksheet in Normal view', 'In the formula bar', 'In the Name Box'], 'You see them in Page Layout view and in print preview.');
mc('m2_print', 'What does a print area do?', 'Specifies which range or ranges of the worksheet will print', ['Sets the page orientation', 'Adds gridlines to the page', 'Locks the cells'], 'Highlight the area and choose Set Print Area.');
mc('m2_print', 'Which is an example of dynamic information in a header or footer?', 'Page number, total pages, sheet name or date printed', ['A hand typed note that never changes', 'A cell reference', 'A chart title'], 'Dynamic items update automatically.');

/* ===================== MODULE 3 ===================== */
topic('m3_design', 3, 'Designing a workbook for calculations', `
<ul>
<li>A workbook with many calculations is hard to read. Document it.</li>
<li>Best practice: a <b>Documentation sheet</b> that lists the formulas and explains the assumptions behind them.</li>
<li>A <b>constant</b> is a term in an equation whose value does not change.</li>
<li>Show the <b>units</b> next to the calculated value, such as miles, gallons or dollars.</li>
<li>Put assumptions such as a tax rate or growth rate in their own cells. Point to them with absolute references so you can change them in one place.</li>
</ul>`);
mc('m3_design', 'What is a good place to list the formulas in a workbook and explain the assumptions behind them?', 'A Documentation sheet', ['The Quick Access toolbar', 'The Name Box', 'The sheet tab color'], 'Document the calculations so others can interpret them.');
mc('m3_design', 'In an equation, what is a constant?', 'A term whose value does not change', ['A cell that is hidden', 'A formula that returns text', 'A range that has been merged'], 'Examples: the number of days in a week, or a fixed conversion factor.');
mc('m3_design', 'Why display units next to a calculated value?', 'So readers know what the number measures, such as miles or dollars', ['So the formula calculates faster', 'So the cell is locked', 'So the number becomes text'], 'Units give numbers meaning.');
mc('m3_design', 'A model has a tax rate of 30%. Where is the best place to keep it?', 'In its own cell, referenced by the formulas', ['Typed inside every formula', 'In the sheet name', 'In the header of the printed page'], 'Keep assumptions in cells. If the rate changes you update one cell and every formula follows.');

topic('m3_dates', 3, 'Dates, times and date functions', `
<ul>
<li>Excel stores dates and times as numbers: <b>days since January 0, 1900</b>.</li>
<li>Full days are whole numbers. Part of a day is a fraction. <b>0.5 is 12 hours</b>.</li>
<li>Because dates are numbers, you can subtract them to get intervals. Days to due date: <b>=C3-$C$1</b> where C1 holds <b>=TODAY()</b>.</li>
</ul>
<table class="mini"><tr><th>Function</th><th>What it does</th></tr>
<tr><td>DATE(year,month,day)</td><td>Builds a date from three numbers</td></tr>
<tr><td>DAY(serial_number)</td><td>Day of the month</td></tr>
<tr><td>MONTH(serial_number)</td><td>Month number (1 = January)</td></tr>
<tr><td>YEAR(serial_number)</td><td>The four digit year</td></tr>
<tr><td>WEEKDAY(serial_number,[return_type])</td><td>Day of week. 1 = Sunday, 2 = Monday... by default</td></tr>
<tr><td>WORKDAY(start_date,days,[holidays])</td><td>The date that many workdays after the start</td></tr>
<tr><td>NETWORKDAYS(start_date,end_date,[holidays])</td><td>Whole working days between two dates</td></tr>
<tr><td>TODAY( )</td><td>Today's date</td></tr>
<tr><td>NOW( )</td><td>Current date and time</td></tr></table>`);
mc('m3_dates', 'How does Excel store dates and times?', 'As the number of days since January 0, 1900', ['As text strings', 'As the number of seconds since midnight', 'As pictures of a calendar'], 'Whole numbers are full days. Fractions are parts of a day.');
mc('m3_dates', 'What number represents 12 hours (half a day) in Excel?', '0.5', ['12', '1.2', '0.12'], 'A full day is 1. Half a day is 0.5.');
mc('m3_dates', 'Which function returns the current date AND time?', 'NOW()', ['TODAY()', 'DATE()', 'WORKDAY()'], 'TODAY returns only the date. NOW returns the date and time.');
mc('m3_dates', 'Which function returns only the current date?', 'TODAY()', ['NOW()', 'WEEKDAY()', 'DAY()'], 'TODAY has no arguments.');
mc('m3_dates', 'Which function counts whole working days between two dates?', 'NETWORKDAYS', ['WORKDAY', 'WEEKDAY', 'DAY'], 'NETWORKDAYS(start_date,end_date,[holidays]). WORKDAY returns a date.');
mc('m3_dates', 'Which function returns the date that falls a given number of workdays after a start date?', 'WORKDAY', ['NETWORKDAYS', 'DATE', 'MONTH'], 'WORKDAY(start_date,days,[holidays]).');
mc('m3_dates', 'By default, what number does WEEKDAY return for a Sunday?', '1', ['0', '7', '2'], '1 is Sunday, 2 is Monday, and so on, unless you change return_type.');
mc('m3_dates', 'What is the purpose of the optional holidays argument in WORKDAY and NETWORKDAYS?', 'It lists dates to skip', ['It adds extra days', 'It changes the date format', 'It converts the result to text'], 'Provide a range of holiday dates to exclude them.');
nm('m3_dates', 'A1 holds the date 4/2/2029. What does =WEEKDAY(A1) return? (The default return type applies.)', { A1: { d: '2029-04-02' } }, '=WEEKDAY(A1)', 'April 2, 2029 is a Monday. With the default, Sunday is 1 and Monday is 2.');
nm('m3_dates', 'A1 holds 4/2/2029 and B1 holds 4/6/2029. What does =B1-A1 return?', { A1: { d: '2029-04-02' }, B1: { d: '2029-04-06' } }, '=B1-A1', 'Dates are numbers. Subtracting gives the number of days between them.');
nm('m3_dates', 'A1 holds 4/2/2029 (a Monday) and B1 holds 4/6/2029 (a Friday). What does =NETWORKDAYS(A1,B1) return?', { A1: { d: '2029-04-02' }, B1: { d: '2029-04-06' } }, '=NETWORKDAYS(A1,B1)', 'NETWORKDAYS counts both end dates. Monday through Friday is 5 working days.');
nm('m3_dates', 'A1 holds the date 4/6/2029. What does =MONTH(A1) return?', { A1: { d: '2029-04-06' } }, '=MONTH(A1)', 'MONTH returns the month number. April is 4.');
fx('m3_dates', 'Task due dates are in C3:C17 and today\'s date (from =TODAY()) is in C1. In D3, write a formula for the number of days until the due date. It must copy down correctly.', { grid: { C1: { d: '2026-02-20' }, C3: { d: '2026-02-22' }, C4: { d: '2026-02-23' }, C5: { d: '2026-03-03' } }, target: 'D3', copy: ['D4', 'D5'], ref: '=C3-$C$1' }, '=C3-$C$1. Lock the "today" cell with $ so it does not move when you copy down.', 'Which cell must stay locked when you copy down?');
fx('m3_dates', 'A start date is in D3. In D4, write a formula for the next business day (one workday after D3).', { grid: { D3: { d: '2029-04-02' } }, target: 'D4', ref: '=WORKDAY(D3,1)' }, '=WORKDAY(D3,1).');
fx('m3_dates', 'A project start date is in B2 and the end date is in B3. In B5, write a formula for the number of whole working days between them.', { grid: { B2: { d: '2029-04-02' }, B3: { d: '2029-04-27' } }, target: 'B5', ref: '=NETWORKDAYS(B2,B3)' }, '=NETWORKDAYS(B2,B3).');
fx('m3_dates', 'A date is in B2. In C2, write a formula that returns the 4 digit year from that date.', { grid: { B2: { d: '2029-04-06' } }, target: 'C2', ref: '=YEAR(B2)' }, '=YEAR(B2).');

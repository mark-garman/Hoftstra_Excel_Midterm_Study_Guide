topic('m3_autofill', 3, 'AutoFill and filling a series', `
<ul>
<li><b>AutoFill</b> extends a formula or a pattern of data into a selected range. It is usually faster than copy and paste, which takes two actions.</li>
<li>The <b>fill handle</b> is the small green square (or bold +) in the lower right corner of the selected cell.</li>
<li><b>Double click</b> the fill handle to extend down the range. Or <b>drag</b> it.</li>
<li>AutoFill copies <b>formulas and formatting</b>. Use the <b>Auto Fill Options</b> menu to fill only the formulas or only the formatting.</li>
<li>To extend a pattern (dates, numbers, text), enter enough values to show the pattern, select them and drag the fill handle.</li>
<li><b>Series dialog:</b> select the range, Home tab, Editing group, Fill, Series. Use it for complex patterns.</li>
<li>If the fill handle is off: File, Options, Advanced, Editing options, check <b>Enable fill handle and cell drag-and-drop</b>.</li>
</ul>`, 'fill');
mc('m3_autofill', 'What does the fill handle look like?', 'A small green square (or bold +) in the lower right corner of the selected cell', ['A red triangle in the upper left corner', 'A blue circle at the top of the column', 'A dotted line around the sheet'], 'Point at the corner. The pointer changes to a bold +.');
mc('m3_autofill', 'What happens when you double click the fill handle of a cell with a formula?', 'Excel extends the formula down the adjacent range', ['Excel deletes the formula', 'Excel opens the Series dialog', 'Excel converts the formula to a value'], 'You can also drag the handle across the range.');
mc('m3_autofill', 'By default, AutoFill extends', 'Both formulas and formatting', ['Only formulas', 'Only formatting', 'Only values'], 'Use the Auto Fill Options menu to choose only formulas or only formatting.');
mc('m3_autofill', 'Where do you open the Series dialog box?', 'Home tab, Editing group, Fill, Series', ['Insert tab, Charts group', 'Page Layout tab, Page Setup', 'Data tab, Get Data'], 'Select the range first.');
mc('m3_autofill', 'Where do you turn on the fill handle if it is disabled?', 'File, Options, Advanced, Editing options', ['Page Layout, Scale to Fit', 'Home, Number', 'View, Zoom'], 'Check Enable fill handle and cell drag-and-drop, then OK.');
mc('m3_autofill', 'Why is AutoFill often faster than copy and paste?', 'It does the work in one action instead of two', ['It uses less memory', 'It changes the formulas to values', 'It skips the formatting'], 'Copy and paste are two distinct actions. AutoFill is one drag or double click.');
mc('m3_autofill', 'You type 1/1/2029 and 2/1/2029 in two cells, select both and drag the fill handle. What happens?', 'Excel extends the date pattern in the same steps', ['Excel repeats the same two dates', 'Excel shows an error', 'Excel clears the cells'], 'Enter enough values to establish the pattern, select them, and drag.');

topic('m3_refs', 3, 'Relative, absolute and mixed references', `
<p><b>This is the big idea in Module 3. Know when to use each one.</b></p>
<ul>
<li><b>Relative</b> (B1): changes based on where the formula goes. Copy <b>=B1+A2</b> two columns right and you get <b>=D1+C2</b>. Move it down 2 rows and you get <b>=B3+A4</b>.</li>
<li><b>Absolute</b> ($B$8): locked to one cell no matter where you copy it. Example: <b>=$B$8+$A$2</b>.</li>
<li><b>Mixed</b> ($B2 or A$2): locks only the column or only the row. In <b>$B2</b>, column B is locked and row 2 is relative. In <b>A$2</b>, row 2 is locked and column A is relative.</li>
</ul>
<p><b>How to decide:</b> ask what must stay put when you copy. If every copy should use the same assumption cell (tax rate, growth rate, a "today" cell, a total), lock it with $. If each copy should use its own row or column, leave it relative.</p>
<p class="tip">Exam tip: in the Pride Widget model, =B13*(1+$B$6) copies right correctly. =B13*(1+B6) drifts to C6, D6, and gives wrong answers. Try the Copy Lab below.</p>`, 'copylab');
tr('m3_refs', '=B1+A2', 'C3', 'E3', 'Copying two columns to the right shifts every relative column by two. B becomes D and A becomes C.');
tr('m3_refs', '=B1+A2', 'C3', 'C5', 'Copying two rows down shifts every relative row by two. 1 becomes 3 and 2 becomes 4.');
tr('m3_refs', '=$B$8+$A$2', 'D3', 'F6', 'Both references are absolute, so nothing changes.');
tr('m3_refs', '=$B2+A$2', 'C3', 'D4', 'In $B2 the column is locked, so only the row moves: $B3. In A$2 the row is locked, so only the column moves: B$2. The result is =$B3+B$2.');
tr('m3_refs', '=B13*(1+$B$6)', 'C13', 'D13', 'The relative B13 shifts one column to C13. The absolute $B$6 stays put.');
tr('m3_refs', '=B13*(1+B6)', 'C13', 'D13', 'Both references are relative. B13 shifts to C13 and B6 shifts to C6. C6 is empty, so the result would be wrong.');
tr('m3_refs', '=IF(B21>0,B21*$B$5,0)', 'B22', 'C22', 'B21 shifts to C21. $B$5 stays locked on the tax rate.');
tr('m3_refs', '=B4*$G$2', 'B5', 'D5', 'The profit reference shifts across to D4. The tax rate in $G$2 stays locked.');
tr('m3_refs', '=C3-$C$1', 'D3', 'D8', 'The due date shifts down to C8. The "today" cell $C$1 stays locked.');
tr('m3_refs', '=VLOOKUP(C4,$H$4:$I$13,2,TRUE)', 'D4', 'D9', 'C4 shifts down to C9. The lookup table $H$4:$I$13 stays locked so the table does not slide.');
tr('m3_refs', '=$A2*B$1', 'B2', 'D4', 'A multiplication table: $A locks the column and B$1 locks the row. From B2 to D4 you get $A4*D$1.');
tr('m3_refs', '=B2/$B$8', 'C2', 'C6', 'The share of total: B2 moves down to B6, but the total in $B$8 stays locked. The result is =B6/$B$8.');
mc('m3_refs', 'In the reference $B2, what is locked?', 'The column (B) only', ['The row (2) only', 'Both the column and the row', 'Neither the column nor the row'], 'The $ in front of B locks the column. Row 2 is relative.');
mc('m3_refs', 'In the reference A$2, what is locked?', 'The row (2) only', ['The column (A) only', 'Both the column and the row', 'Neither'], 'The $ in front of 2 locks the row.');
mc('m3_refs', 'Which type of reference stays locked to a cell even when the formula is copied to a new location?', 'Absolute', ['Relative', 'Mixed', 'External'], 'An absolute reference such as $B$8 does not change.');
mc('m3_refs', 'A tax rate is in B5. You write a formula for 2024 and copy it across to 2025 and 2026. How should the formula refer to the tax rate?', '$B$5', ['B5', 'B$5 only', '$B5 only'], 'Lock the assumption with an absolute reference so every copy uses the same rate.');
mc('m3_refs', 'You copy =B13*(1+B6) one column to the right and it becomes =C13*(1+C6). What went wrong?', 'The growth rate reference should have been absolute ($B$6)', ['The formula should not have parentheses', 'B13 should have been absolute', 'You must use the SUM function'], 'The assumption cell B6 drifted to an empty cell. Lock it with $B$6.');
mc('m3_refs', 'Which reference type changes based on its position relative to the cell containing the formula?', 'Relative', ['Absolute', 'Mixed with both locked', 'Named'], 'Relative references shift when you copy or move the formula.');
mc('m3_refs', 'You build a multiplication table with row numbers down column A and column numbers across row 1. Which formula in B2 fills the whole table correctly when copied down and across?', '=$A2*B$1', ['=A2*B1', '=$A$2*$B$1', '=A$2*$B1'], 'Lock the column of the row headings ($A) and the row of the column headings (B$1). That is the mixed reference pattern.');
mc('m3_refs', 'A formula =B1+A2 is moved down 2 rows (copied and pasted two rows lower). What does it become?', '=B3+A4', ['=D1+C2', '=B1+A2', '=B2+A3'], 'Both relative rows shift down by two.');
fx('m3_refs', 'Row 13 shows sales for 2023 in B13. The growth rate is in B6. In C13 write a formula for next year\'s sales (prior year times 1 plus the growth rate). It must copy right to D13 and E13 correctly.', { grid: { A6: 'Sales growth', B6: 0.05, A13: 'Sales', B13: 360000, C13: 1, D13: 1, E13: 1 }, vary: { B6: [0.02, 0.1, 2], B13: [100000, 500000] }, target: 'C13', copy: ['D13', 'E13'], hide: ['C13', 'D13', 'E13'], ref: '=B13*(1+$B$6)' }, '=B13*(1+$B$6). B13 stays relative so it moves to the prior year. $B$6 stays locked.', 'Which cell is the assumption?');
fx('m3_refs', 'Profit for each product is in row 4 (B4:D4). The tax rate is in G2. In B5, write a formula for tax (profit times the tax rate). It must copy right to C5 and D5.', { grid: { A4: 'Profit', B4: 6, C4: 5, D4: 3, F2: 'Tax rate', G2: 0.15 }, vary: { B4: [1, 40], C4: [1, 40], D4: [1, 40], G2: [0.05, 0.4, 2] }, target: 'B5', copy: ['C5', 'D5'], ref: '=B4*$G$2' }, '=B4*$G$2.');
fx('m3_refs', 'Marketing spend for 2023 is in B17. The yearly increase (a dollar amount) is in B8. In C17 write a formula for next year\'s marketing (prior year plus the increase). It must copy right.', { grid: { A8: 'Marketing increase', B8: 10000, A17: 'Marketing', B17: 50000, C17: 1, D17: 1, E17: 1 }, vary: { B8: [2000, 20000], B17: [20000, 90000] }, target: 'C17', copy: ['D17', 'E17'], hide: ['C17', 'D17', 'E17'], ref: '=B17+$B$8' }, '=B17+$B$8.');
fx('m3_refs', 'Item sales are in B2:B5 and the total is in B6. In C2, write a formula for each item\'s share of the total. It must copy down to C5.', { grid: { A2: 'A', B2: 40, A3: 'B', B3: 25, A4: 'C', B4: 15, A5: 'D', B5: 20, A6: 'Total', B6: 100 }, vary: { B2: [10, 90], B3: [10, 90], B4: [10, 90], B5: [10, 90], B6: [200, 400] }, target: 'C2', copy: ['C3', 'C4', 'C5'], ref: '=B2/$B$6' }, '=B2/$B$6. The numerator moves down. The total stays locked.');
fx('m3_refs', 'Row 1 (B1:E1) holds quantities and column A (A2:A5) holds unit prices. In B2, write one formula that, when copied across and down the whole table, gives price times quantity.', { grid: { B1: 1, C1: 2, D1: 3, E1: 4, A2: 5, A3: 10, A4: 15, A5: 20 }, vary: { B1: [1, 9], C1: [1, 9], D1: [1, 9], E1: [1, 9], A2: [1, 50], A3: [1, 50], A4: [1, 50], A5: [1, 50] }, target: 'B2', copy: ['C2', 'D2', 'E2', 'B3', 'C4', 'E5'], ref: '=$A2*B$1' }, '=$A2*B$1. Mixed references: column A locked for prices, row 1 locked for quantities.', 'Lock the column of the prices and the row of the quantities.');

topic('m3_errors', 3, 'Error values', `
<p>When Excel cannot resolve a formula it returns an error value. A small indicator appears in the upper left corner of the cell. Point to it for a ScreenTip.</p>
<table class="mini"><tr><th>Error</th><th>Meaning</th></tr>
<tr><td><b>#DIV/0!</b></td><td>Dividing a number by 0</td></tr>
<tr><td><b>#NAME?</b></td><td>Excel does not recognize text in the formula, such as a misspelled function name</td></tr>
<tr><td><b>#N/A</b></td><td>A value is not available to a function or formula</td></tr>
<tr><td><b>#NULL!</b></td><td>Two ranges are required to intersect, but they do not</td></tr>
<tr><td><b>#NUM!</b></td><td>Invalid numbers used in a formula or function</td></tr>
<tr><td><b>#REF!</b></td><td>A cell reference is no longer valid, for example the cell was deleted</td></tr>
<tr><td><b>#VALUE!</b></td><td>Wrong type of argument, such as text where a number is needed</td></tr></table>`, 'errors');
mc('m3_errors', 'Which error value appears when a formula divides a number by 0?', '#DIV/0!', ['#VALUE!', '#NUM!', '#N/A'], 'Check the denominator.');
mc('m3_errors', 'You type =SUMM(B2:B9). Which error value does Excel show?', '#NAME?', ['#REF!', '#VALUE!', '#NULL!'], 'Excel does not recognize SUMM as a function name.');
mc('m3_errors', 'You delete a column that a formula refers to. Which error value shows?', '#REF!', ['#N/A', '#DIV/0!', '#NAME?'], 'The cell reference is no longer valid.');
mc('m3_errors', 'A1 contains the text "abc" and you enter =A1+5. Which error value shows?', '#VALUE!', ['#NAME?', '#NUM!', '#REF!'], 'Text was used where the formula needs a number.');
mc('m3_errors', 'Which error means a value is not available to a function or formula, for example an exact lookup with no match?', '#N/A', ['#NULL!', '#NUM!', '#DIV/0!'], '#N/A means not available.');
mc('m3_errors', 'Which error appears when a formula requires two cell ranges to intersect and they do not?', '#NULL!', ['#REF!', '#N/A', '#VALUE!'], '#NULL! relates to range intersections.');
mc('m3_errors', 'Which error value means invalid numbers were used in a formula or function?', '#NUM!', ['#NAME?', '#VALUE!', '#DIV/0!'], '#NUM! means an invalid number.');
mc('m3_errors', 'How can you learn more about an error in a cell?', 'Point to the error indicator in the upper left corner to see a ScreenTip', ['Press Delete', 'Open Backstage view', 'Change the number format'], 'The error indicator appears in the upper left corner of the cell.');
nm('m3_errors', 'B1 holds 0 and A1 holds 25. What does =A1/B1 return?', { A1: 25, B1: 0 }, '=A1/B1', 'Dividing by zero returns #DIV/0!.');

topic('m3_functions', 3, 'Statistics, rounding, nesting and blanks', `
<ul>
<li>Excel has <b>over 500 functions</b> in a function library of <b>13 categories</b> (Database, Date &amp; Time, Engineering, Financial, Logical, Math &amp; Trig, Statistical and more).</li>
<li><b>MIN</b> and <b>MAX</b> return the smallest and largest values. Find them with AutoSum on the Home or Formulas tab.</li>
<li><b>Average (mean):</b> sum divided by count. <b>Median:</b> the center value. <b>Mode:</b> the value repeated most often.</li>
<li><b>ROUND</b> rounds to the nearest digit. <b>ROUNDDOWN</b> rounds down. <b>ROUNDUP</b> rounds up. <b>INT</b> always rounds down to the next lowest integer.</li>
<li>A negative number of digits rounds to the left of the decimal point. ROUND(1234,-2) is 1200.</li>
<li><b>Nested functions:</b> Excel evaluates the innermost function first and works outward. Example: <b>ROUND(AVERAGE(A2:B100),2)</b> averages first, then rounds to 2 decimal places. Excel colors each pair of parentheses to help you read them.</li>
<li><b>Blanks and zeros:</b> a blank cell is not treated as zero. AVERAGE skips blanks but counts zeros.</li>
<li><b>SUMIF</b> adds only the values that meet a condition, such as <b>=SUMIF(B3:D9,"&gt;90")</b>. It appears in the class workbook.</li>
</ul>`);
nm('m3_functions', 'What does =ROUND(2.567,1) return?', null, '=ROUND(2.567,1)', 'Round to 1 decimal place. 2.567 rounds to 2.6.');
nm('m3_functions', 'What does =ROUNDDOWN(2.567,1) return?', null, '=ROUNDDOWN(2.567,1)', 'ROUNDDOWN cuts toward the lower value: 2.5.');
nm('m3_functions', 'What does =ROUNDUP(2.511,1) return?', null, '=ROUNDUP(2.511,1)', 'ROUNDUP goes to the next higher digit: 2.6.');
nm('m3_functions', 'What does =INT(7.9) return?', null, '=INT(7.9)', 'INT always rounds down to the next lowest integer: 7.');
nm('m3_functions', 'What does =INT(-7.2) return?', null, '=INT(-7.2)', 'INT rounds down to the next LOWEST integer. The next lowest integer below -7.2 is -8.');
nm('m3_functions', 'What does =ROUND(1234,-2) return?', null, '=ROUND(1234,-2)', 'A negative digit rounds to the left of the decimal point. 1234 rounds to 1200.');
nm('m3_functions', 'Cells A1:A5 hold 3, 9, 5, 7, 1. What does =MEDIAN(A1:A5) return?', { A1: 3, A2: 9, A3: 5, A4: 7, A5: 1 }, '=MEDIAN(A1:A5)', 'Sorted: 1, 3, 5, 7, 9. The center value is 5.');
nm('m3_functions', 'Cells A1:A6 hold 4, 2, 4, 7, 4, 2. What does =MODE(A1:A6) return?', { A1: 4, A2: 2, A3: 4, A4: 7, A5: 4, A6: 2 }, '=MODE(A1:A6)', 'MODE returns the value that repeats most often. 4 appears three times.');
nm('m3_functions', 'Cells A1:A4 hold 10, 0, 20 and an empty cell A4. What does =AVERAGE(A1:A4) return?', { A1: 10, A2: 0, A3: 20 }, '=AVERAGE(A1:A4)', 'AVERAGE skips the blank but counts the zero. (10 + 0 + 20) divided by 3 is 10.');
nm('m3_functions', 'Cells A1:A4 hold 10, 20, 30, 40. What does =ROUND(AVERAGE(A1:A4)/3,2) return?', { A1: 10, A2: 20, A3: 30, A4: 40 }, '=ROUND(AVERAGE(A1:A4)/3,2)', 'The average is 25. 25 divided by 3 is 8.3333. Rounded to 2 places is 8.33.');
nm('m3_functions', 'Cells B3:D4 hold 28, 75, 55 in row 3 and 32, 32, 41 in row 4. What does =SUMIF(B3:D4,">50") return?', { B3: 28, C3: 75, D3: 55, B4: 32, C4: 32, D4: 41 }, '=SUMIF(B3:D4,">50")', 'Only 75 and 55 are greater than 50. 75 plus 55 is 130.');
mc('m3_functions', 'In a nested function, which function does Excel evaluate first?', 'The innermost function', ['The outermost function', 'The function written first from the left', 'The one with the most arguments'], 'It works outward. The inner result becomes an argument for the outer function.');
mc('m3_functions', 'In =ROUND(AVERAGE(A2:B100),2), what happens first?', 'AVERAGE is calculated', ['ROUND is calculated', 'The range is sorted', 'The 2 is converted to a date'], 'AVERAGE first, then ROUND the result to 2 decimal places.');
mc('m3_functions', 'About how many functions does Excel have, organized into how many categories in the function library?', 'Over 500 functions in 13 categories', ['About 50 functions in 4 categories', 'About 100 functions in 6 categories', 'Over 500 functions in 3 categories'], 'The function library has 13 categories such as Financial, Logical and Statistical.');
mc('m3_functions', 'Which function always rounds a value down to the next lowest integer?', 'INT', ['ROUNDUP', 'ROUND', 'MODE'], 'INT is in the Math & Trig category.');
mc('m3_functions', 'What does the median represent?', 'The center value, with half the values below and half above', ['The value repeated most often', 'The sum divided by the count', 'The largest value'], 'The mean is the average. The mode is the most frequent value.');
mc('m3_functions', 'In a data series, the value repeated most often is the', 'Mode', ['Median', 'Mean', 'Range'], 'MODE returns the most frequent value.');
fx('m3_functions', 'Scores are in B2:B9. In B11 write a formula that rounds the average of the scores to 1 decimal place. Use a nested function.', { grid: { B2: 88, B3: 92, B4: 75, B5: 81, B6: 69, B7: 95, B8: 77, B9: 84 }, vary: { B2: [40, 100], B3: [40, 100], B4: [40, 100], B5: [40, 100], B6: [40, 100], B7: [40, 100], B8: [40, 100], B9: [40, 100] }, target: 'B11', ref: '=ROUND(AVERAGE(B2:B9),1)' }, '=ROUND(AVERAGE(B2:B9),1). The AVERAGE runs first.', 'Put AVERAGE inside ROUND.');
fx('m3_functions', 'Prices are in B2:B6. In B8 write a formula for the middle price (the median).', { grid: { B2: 12, B3: 45, B4: 8, B5: 30, B6: 22 }, vary: { B2: [5, 90], B3: [5, 90], B4: [5, 90], B5: [5, 90], B6: [5, 90] }, target: 'B8', ref: '=MEDIAN(B2:B6)' }, '=MEDIAN(B2:B6).');
fx('m3_functions', 'Beverages sold are in B3:D9. In B14, write a formula that adds only the values greater than 90.', { grid: { B3: 28, C3: 75, D3: 55, B4: 32, C4: 32, D4: 41, B5: 52, C5: 40, D5: 92, B6: 67, C6: 21, D6: 89, B7: 44, C7: 58, D7: 34, B8: 39, C8: 21, D8: 29, B9: 100, C9: 54, D9: 100 }, target: 'B14', ref: '=SUMIF(B3:D9,">90")' }, '=SUMIF(B3:D9,">90"). The criteria go in quotation marks.', 'SUMIF(range, criteria).');
fx('m3_functions', 'A price is in B2. In C2, write a formula that rounds the price UP to the next whole dollar.', { grid: { B2: 12.35 }, vary: { B2: [1, 90, 2] }, target: 'C2', ref: '=ROUNDUP(B2,0)' }, '=ROUNDUP(B2,0). Zero digits means a whole number.');

topic('m3_if', 3, 'The IF function', `
<ul>
<li>A <b>logical function</b> returns one of two values depending on whether a condition is true or false.</li>
<li><b>IF(logical_test, value_if_true, [value_if_false])</b></li>
<li>The <b>logical test</b> is a condition that is either TRUE or FALSE. It uses a <b>comparison operator</b>: = &gt; &lt; &gt;= &lt;= &lt;&gt; (not equal).</li>
<li>Example: <b>=IF(A2=B2,100,0)</b> returns 100 if A2 equals B2, otherwise 0.</li>
<li>Tax example: <b>=IF(B21&gt;0,B21*$B$5,0)</b>. Tax only applies when earnings before taxes are above zero.</li>
<li>Text results go in <b>quotation marks</b>: =IF(B2&gt;=60,"Pass","Fail").</li>
<li>A <b>KPI (key performance indicator)</b> compares a measured outcome to an established norm or baseline. Examples: average call wait time, time items sit in inventory, average shipping delay, client retention rate.</li>
</ul>`);
nm('m3_if', 'A2 holds 50 and B2 holds 50. What does =IF(A2=B2,100,0) return?', { A2: 50, B2: 50 }, '=IF(A2=B2,100,0)', 'The test A2=B2 is TRUE, so IF returns the second argument: 100.');
nm('m3_if', 'B21 holds -5000, B5 holds 0.3. What does =IF(B21>0,B21*$B$5,0) return?', { B21: -5000, B5: 0.3 }, '=IF(B21>0,B21*$B$5,0)', 'B21 is negative, so the test is FALSE. IF returns 0. No tax is owed on a loss.');
nm('m3_if', 'B21 holds 50000, B5 holds 0.3. What does =IF(B21>0,B21*$B$5,0) return?', { B21: 50000, B5: 0.3 }, '=IF(B21>0,B21*$B$5,0)', 'The test is TRUE. 50000 times 0.3 is 15000.');
nm('m3_if', 'A1 holds 72. What does =IF(A1>=60,"Pass","Fail") return? (Type the word.)', { A1: 72 }, '=IF(A1>=60,"Pass","Fail")', '72 is at least 60, so the result is Pass.');

topic('m3_lookup', 3, 'Lookup functions: VLOOKUP, HLOOKUP, XLOOKUP', `
<ul>
<li>A <b>lookup function</b> retrieves a value from a <b>lookup table</b>.</li>
<li>The <b>lookup array</b> holds the values to match. The <b>return array</b> holds the values you get back.</li>
<li><b>Vertical</b> lookup table: lookup values run down a column. <b>Horizontal</b>: they run across a row.</li>
<li><b>Exact match:</b> the lookup value must match one of the values exactly. Example: an order ID.</li>
<li><b>Approximate match:</b> the lookup value falls within a range. Example: a letter grade from an exam score. The lookup values (the lowest score for each grade) must be sorted ascending.</li>
</ul>
<table class="mini"><tr><th>Function</th><th>Syntax</th></tr>
<tr><td>VLOOKUP</td><td>VLOOKUP(lookup_value, table_array, col_index_num, [range_lookup])</td></tr>
<tr><td>HLOOKUP</td><td>HLOOKUP(lookup_value, table_array, row_index_num, [range_lookup])</td></tr>
<tr><td>XLOOKUP</td><td>XLOOKUP(lookup_value, lookup_array, return_array, [if_not_found], [match_mode], [search_mode])</td></tr></table>
<ul>
<li><b>range_lookup:</b> TRUE = approximate. FALSE = exact.</li>
<li>XLOOKUP example: <b>=XLOOKUP(A2,C2:C100,D2:D100,"No match found",0)</b> looks up A2 in C2:C100. It returns the matching value from D2:D100, or "No match found".</li>
<li>Grade table example: <b>=VLOOKUP(C4,$H$4:$I$13,2,TRUE)</b> and <b>=XLOOKUP(C4,$I$4:$I$13,$J$4:$J$13,,-1)</b> where match_mode -1 means exact or next smaller.</li>
<li>Lock the table with $ so it does not slide when you copy the formula down.</li>
</ul>`, 'lookup');
mc('m3_lookup', 'In a lookup table, what is the return array?', 'The values you retrieve when a match is found', ['The values you try to match', 'The list of error values', 'The cell that holds the formula'], 'The lookup array holds values to match. The return array holds what you get back.');
mc('m3_lookup', 'Looking up an order by its order ID number is an example of', 'An exact match lookup', ['An approximate match lookup', 'A horizontal lookup only', 'A nested IF'], 'The ID must match exactly.');
mc('m3_lookup', 'Looking up a letter grade from an exam score is an example of', 'An approximate match lookup', ['An exact match lookup', 'A text function', 'A date calculation'], 'Each grade covers a range of scores.');
mc('m3_lookup', 'In VLOOKUP, which value of range_lookup gives an exact match?', 'FALSE', ['TRUE', '0.5', '1'], 'TRUE (or omitted) is approximate. FALSE is exact.');
mc('m3_lookup', 'In VLOOKUP(C4,$H$4:$I$13,2,TRUE), what does the 2 mean?', 'Return the value from the second column of the table', ['Look for the number 2', 'Round to 2 digits', 'Skip 2 rows'], 'col_index_num is the column number inside the table_array.');
mc('m3_lookup', 'What does HLOOKUP search?', 'The top row of the table, then returns a value from a row below', ['The first column of the table', 'Only dates', 'Only text'], 'H stands for horizontal. V stands for vertical.');
mc('m3_lookup', 'What does the if_not_found argument of XLOOKUP do?', 'Sets the value returned when no match is found', ['Sets the sort order', 'Chooses the return column', 'Rounds the result'], 'Example: "No match found".');
mc('m3_lookup', 'Why is the table_array written as $H$4:$I$13 when the formula is copied down a column of scores?', 'So the table stays in place instead of sliding down', ['So the scores are rounded', 'So the lookup is exact', 'So Excel ignores blanks'], 'An absolute reference keeps the table fixed.');
mc('m3_lookup', 'For an approximate match lookup of grades, how should the lookup values be arranged?', 'Sorted in ascending order', ['Sorted in descending order', 'In any order', 'In alphabetical order only'], 'Approximate match works from low to high.');
mc('m3_lookup', 'Which function was the previous standard for lookups, seen in older workbooks?', 'VLOOKUP (and HLOOKUP)', ['XLOOKUP', 'SUMIF', 'NETWORKDAYS'], 'XLOOKUP is the current function that matches a value in the lookup array and returns from the return array.');
const gradeGrid = { H4: 0, I4: 'F', H5: 60, I5: 'D', H6: 70, I6: 'C-', H7: 73, I7: 'C', H8: 77, I8: 'C+', H9: 80, I9: 'B-', H10: 83, I10: 'B', H11: 87, I11: 'B+', H12: 90, I12: 'A-', H13: 93, I13: 'A', C4: 67, C5: 78, C6: 21, C7: 97 };
nm('m3_lookup', 'Using the grade table in H4:I13 (0=F, 60=D, 70=C-, 73=C, 77=C+, 80=B-, 83=B, 87=B+, 90=A-, 93=A), what does =VLOOKUP(C4,$H$4:$I$13,2,TRUE) return when C4 is 67?', gradeGrid, '=VLOOKUP(C4,$H$4:$I$13,2,TRUE)', 'An approximate match finds the largest value less than or equal to 67. That is 60, which returns D.');
nm('m3_lookup', 'Same grade table. What does =VLOOKUP(C7,$H$4:$I$13,2,TRUE) return when C7 is 97?', gradeGrid, '=VLOOKUP(C7,$H$4:$I$13,2,TRUE)', '97 is at least 93, so the grade is A.');
nm('m3_lookup', 'Same grade table. What does =XLOOKUP(C5,$H$4:$H$13,$I$4:$I$13,,-1) return when C5 is 78?', gradeGrid, '=XLOOKUP(C5,$H$4:$H$13,$I$4:$I$13,,-1)', 'match_mode -1 means exact or next smaller. The next smaller value than 78 is 77, which returns C+.');
fx('m3_lookup', 'Scores are in column C. The grade table has the lowest score for each grade in H4:H13 and the letter grade in I4:I13. In D4, write a VLOOKUP approximate match that returns the grade for the score in C4. It must copy down.', { grid: { H4: 0, I4: 'F', H5: 60, I5: 'D', H6: 70, I6: 'C-', H7: 73, I7: 'C', H8: 77, I8: 'C+', H9: 80, I9: 'B-', H10: 83, I10: 'B', H11: 87, I11: 'B+', H12: 90, I12: 'A-', H13: 93, I13: 'A', C4: 67, C5: 78, C6: 21, C7: 97, C8: 86 }, vary: { C4: [0, 100], C5: [0, 100], C6: [0, 100], C7: [0, 100], C8: [0, 100] }, target: 'D4', copy: ['D5', 'D6', 'D7', 'D8'], ref: '=VLOOKUP(C4,$H$4:$I$13,2,TRUE)' }, '=VLOOKUP(C4,$H$4:$I$13,2,TRUE). Lock the table. Leave C4 relative.', 'Approximate match uses TRUE. Lock the table.');
fx('m3_lookup', 'Same grade table. In E4, write an XLOOKUP that returns the grade for the score in C4 using the lookup array H4:H13 and return array I4:I13. Leave if_not_found empty and use match_mode -1. It must copy down.', { grid: { H4: 0, I4: 'F', H5: 60, I5: 'D', H6: 70, I6: 'C-', H7: 73, I7: 'C', H8: 77, I8: 'C+', H9: 80, I9: 'B-', H10: 83, I10: 'B', H11: 87, I11: 'B+', H12: 90, I12: 'A-', H13: 93, I13: 'A', C4: 67, C5: 78, C6: 21, C7: 97 }, vary: { C4: [0, 100], C5: [0, 100], C6: [0, 100], C7: [0, 100] }, target: 'E4', copy: ['E5', 'E6', 'E7'], ref: '=XLOOKUP(C4,$H$4:$H$13,$I$4:$I$13,,-1)' }, '=XLOOKUP(C4,$H$4:$H$13,$I$4:$I$13,,-1).', 'Two commas in a row skip if_not_found.');
fx('m3_lookup', 'Product IDs are in A2:A5 and prices are in B2:B5. A product ID is typed in D2. In E2, write an exact match VLOOKUP that returns the price for the ID in D2.', { grid: { A2: 101, B2: 4.5, A3: 102, B3: 6, A4: 103, B4: 9.25, A5: 104, B5: 12, D2: 103 }, vary: { B2: [1, 20, 2], B3: [1, 20, 2], B4: [1, 20, 2], B5: [1, 20, 2] }, target: 'E2', ref: '=VLOOKUP(D2,A2:B5,2,FALSE)' }, '=VLOOKUP(D2,A2:B5,2,FALSE). FALSE gives an exact match.');
fx('m3_lookup', 'Same table. In E2, write an XLOOKUP that returns the price for the ID in D2. If the ID is not found, show the text "No match found". Use exact match.', { grid: { A2: 101, B2: 4.5, A3: 102, B3: 6, A4: 103, B4: 9.25, A5: 104, B5: 12, D2: 103 }, vary: { B2: [1, 20, 2], B3: [1, 20, 2], B4: [1, 20, 2], B5: [1, 20, 2] }, target: 'E2', ref: '=XLOOKUP(D2,A2:A5,B2:B5,"No match found",0)' }, '=XLOOKUP(D2,A2:A5,B2:B5,"No match found",0).');
fx('m3_lookup', 'Months run across row 1 (A1:C1 = Jan, Feb, Mar) and sales are in row 2 (A2:C2). In B4 write an HLOOKUP exact match that returns the sales for the month named in B3.', { grid: { A1: 'Jan', B1: 'Feb', C1: 'Mar', A2: 5, B2: 6, C2: 7, B3: 'Feb' }, vary: { A2: [1, 90], B2: [1, 90], C2: [1, 90] }, target: 'B4', ref: '=HLOOKUP(B3,A1:C2,2,FALSE)' }, '=HLOOKUP(B3,A1:C2,2,FALSE).');

topic('m3_whatif', 3, 'What-if analysis and Goal Seek', `
<ul>
<li>A <b>what-if analysis</b> explores how changing input values changes calculated and output values.</li>
<li><b>Trial and error:</b> change inputs by hand and watch the results.</li>
<li><b>Goal Seek</b> reverses trial and error. You specify the output you want and Excel works backward to find the input that gets there.</li>
<li>Goal Seek has three boxes: <b>Set cell</b> (the formula cell), <b>To value</b> (the target) and <b>By changing cell</b> (the input to adjust). Find it under Data, What-If Analysis.</li>
<li>Example: in the Pride Widget model, find the sales growth rate that gives a net income of a target amount.</li>
</ul>`);
mc('m3_whatif', 'What does Goal Seek do?', 'Finds the input value needed to reach a target output', ['Finds the average of a range', 'Sorts data by a goal column', 'Counts the cells that meet a condition'], 'It works backward from the result you want to the input.');
mc('m3_whatif', 'How does Goal Seek differ from trial and error?', 'You set the output you want and Excel finds the input', ['It uses charts instead of formulas', 'It changes the output directly', 'It needs no input cells'], 'Goal Seek reverses the trial and error process.');
mc('m3_whatif', 'A what-if analysis examines', 'The impact that changing input values has on calculated values', ['The number of worksheets in a workbook', 'The fonts used in a sheet', 'The print settings'], 'You change an input and see what happens to the outputs.');
mc('m3_whatif', 'In Goal Seek, the "Set cell" must contain', 'A formula', ['A typed constant', 'A chart', 'A text label'], 'The Set cell is the output you want to hit. The By changing cell is the input.');
mc('m3_whatif', 'You want net income to equal $100,000 and need to know what sales growth rate gets you there. In Goal Seek, what is the "By changing cell"?', 'The sales growth rate cell', ['The net income cell', 'The tax rate cell', 'The sheet title'], 'Set cell = net income. To value = 100000. By changing cell = growth rate.');

topic('m4_start', 4, 'Chart basics: types and creating a chart', `
<ul>
<li>Excel has <b>more than 60 chart types</b>, grouped in categories. Each category has <b>subtypes</b>. Find them at Insert, Charts, Recommended Charts, All Charts.</li>
</ul>
<table class="mini"><tr><th>Category</th><th>Use it to</th></tr>
<tr><td>Column or Bar</td><td>Compare values across categories</td></tr>
<tr><td>Line or Area</td><td>Show trends and change over time</td></tr>
<tr><td>Pie</td><td>Show parts of a whole</td></tr>
<tr><td>X Y (Scatter) or Bubble</td><td>Show the relationship between two sets of values</td></tr>
<tr><td>Hierarchy</td><td>Show groups and subgroups sized by a number (treemap, sunburst)</td></tr>
<tr><td>Statistic</td><td>Show the distribution of values (histogram, Pareto, box and whisker)</td></tr>
<tr><td>Waterfall or Stock</td><td>Show cash flow additions and subtractions, or stock data</td></tr>
<tr><td>Combo</td><td>Combine two chart types</td></tr></table>
<p><b>Creating a chart:</b></p>
<ol>
<li>Select the range with the data.</li>
<li>Insert tab, Charts group, choose <b>Recommended Charts</b> or a general chart type. Or use the <b>Quick Analysis</b> button, Charts category.</li>
<li>Chart Design tab, Location group, <b>Move Chart</b>: embed it in a worksheet or put it on its own chart sheet.</li>
<li>Format the chart elements.</li>
</ol>
<ul>
<li>The <b>data source</b> has one or more <b>data series</b> (the values plotted) and a set of <b>category values</b>.</li>
<li>A chart is <b>linked</b> to its data source. Change the data and the chart updates. That makes charts a what-if tool.</li>
<li>An <b>embedded</b> chart sits next to the data on the worksheet. A <b>chart sheet</b> holds only the chart. The Format tab, Size group sets height and width.</li>
</ul>`, 'charts');
mc('m4_start', 'About how many chart types does Excel offer?', 'More than 60', ['About 10', 'About 20', 'Exactly 100'], 'Excel has more than 60 chart types, organized into categories with subtypes.');
mc('m4_start', 'You change a number in the worksheet that a chart is based on. What happens to the chart?', 'It updates, because the chart is linked to its data source', ['It stays the same until you recreate it', 'It is deleted', 'It turns into a table'], 'The link between a chart and its data is what makes charts useful for what-if exploration.');
mc('m4_start', 'Which tab and group let you move a chart to its own chart sheet?', 'Chart Design tab, Location group, Move Chart', ['Home tab, Font group', 'Page Layout tab, Margins group', 'Data tab, Tools group'], 'In the Move Chart dialog choose to embed the chart in a worksheet or use a new chart sheet.');
mc('m4_start', 'In a chart, what is the data series?', 'The actual values plotted on the chart', ['The labels along the horizontal axis', 'The chart title', 'The legend'], 'The category values are the labels. The data series are the numbers.');
mc('m4_start', 'What is an embedded chart?', 'A chart placed on a worksheet next to its data', ['A chart on its own chart sheet', 'A chart that cannot be edited', 'A chart without a data source'], 'Embedded charts can sit alongside text and tables.');
mc('m4_start', 'Which are the first two steps for creating a chart?', 'Select the data range, then choose a chart on the Insert tab or Quick Analysis', ['Choose a chart style, then select the data', 'Move the chart, then type the title', 'Set the print area, then insert the chart'], 'Select the range first, then pick Recommended Charts or a general chart type.');
mc('m4_start', 'Which chart category is best for showing the relationship between two sets of numeric values?', 'X Y (Scatter) or Bubble', ['Pie', 'Waterfall', 'Hierarchy'], 'Scatter charts plot one numeric series against another.');
mc('m4_start', 'Where do you adjust the height and width of a selected chart?', 'Format tab, Size group', ['Home tab, Alignment group', 'Insert tab, Illustrations group', 'View tab, Zoom group'], 'The Format tab opens when you create a chart. Its Size group holds Height and Width.');

topic('m4_elements', 4, 'Chart elements, layouts, styles and filters', `
<ul>
<li>The individual parts of a chart are <b>chart elements</b>: title, legend, axes, axis titles, gridlines, data labels, data markers and more. Use the <b>Chart Elements</b> button to add or remove them.</li>
<li>Each element has a submenu of common formatting choices.</li>
<li><b>Quick Layout</b> (Chart Design tab) applies a predefined layout of elements.</li>
<li><b>Chart Styles</b> apply a professional design to all the elements at once.</li>
<li><b>Colors</b> submenu changes the chart's color scheme.</li>
<li>The <b>Filter</b> button removes categories or series so the chart focuses on fewer items.</li>
<li><b>Edit a title:</b> click Chart Title, type the new title, press Enter. This works for all chart types.</li>
<li>The <b>legend</b> identifies which color or marker belongs to each data series.</li>
</ul>`);
mc('m4_elements', 'What are the individual parts of a chart called?', 'Chart elements', ['Chart cells', 'Chart ranges', 'Chart sparklines'], 'Examples: title, legend, axes, gridlines, data labels.');
mc('m4_elements', 'What does the Filter button on a chart do?', 'Removes categories or series so the chart focuses on fewer items', ['Sorts the data in the worksheet', 'Changes the chart type', 'Adds a trendline'], 'The filter changes what is shown on the chart.');
mc('m4_elements', 'What does Quick Layout do?', 'Applies a predefined arrangement of chart elements', ['Changes the data source', 'Prints the chart', 'Moves the chart to a new sheet'], 'It is on the Chart Design tab.');
mc('m4_elements', 'What does applying a Chart Style do?', 'Applies a professional design to all the elements of the chart at once', ['Changes only the title', 'Edits the data source', 'Resizes the chart'], 'This saves you from formatting each element separately.');
mc('m4_elements', 'How do you change the text of a chart title?', 'Click Chart Title, type the new title and press Enter', ['Edit the Name Box', 'Use Find and Replace', 'Change the sheet tab name'], 'The same method works for every chart type.');
mc('m4_elements', 'What does a legend tell the reader?', 'Which color or marker represents each data series', ['The file name', 'The print area', 'The data source address'], 'Legends matter most when a chart has more than one series.');

topic('m4_pie', 4, 'Pie charts', `
<ul>
<li>A <b>pie chart</b> is a circle divided into slices. Each slice is one value from a data series. Bigger values get bigger slices.</li>
<li>Use a pie to show <b>parts of a whole</b>.</li>
<li>Pie charts work best with <b>six or fewer slices</b>, and when each slice is large enough to see.</li>
<li>Column charts compare categories better than pie charts because column heights are easy to compare directly.</li>
<li>Create from the Quick Analysis tool (Charts category) or Insert, Charts, Recommended Charts. Both show types that suit the data.</li>
</ul>`, 'charts');
mc('m4_pie', 'A pie chart is most effective with', 'Six or fewer slices', ['At least twelve slices', 'Exactly ten slices', 'Only two slices'], 'Too many slices become hard to read.');
mc('m4_pie', 'What does each slice of a pie chart represent?', 'A single value from a data series', ['A whole worksheet', 'A chart style', 'A formula'], 'Larger values get larger slices.');
mc('m4_pie', 'You want to show how each product contributes to total sales this quarter. Which chart is the best fit?', 'Pie chart', ['Line chart', 'Scatter chart', 'Sparkline'], 'Pie charts show parts of a whole.');
mc('m4_pie', 'You want to show how monthly sales changed over twelve months. Which chart is the better fit?', 'Line chart', ['Pie chart', 'Treemap', 'Doughnut'], 'Line charts show trends over time. A pie of twelve slices is hard to read.');
mc('m4_pie', 'Why do column charts often compare categories better than pie charts?', 'Column heights can be compared directly', ['They use fewer colors', 'They always show percentages', 'They do not need a data source'], 'Pie slices require comparing angles and areas.');

topic('m4_column', 4, 'Column and bar charts', `
<ul>
<li><b>Column chart:</b> vertical columns. Use when labels are short or you show values over time, such as monthly sales.</li>
<li><b>Bar chart:</b> horizontal bars. Use when labels are long or you have many categories, such as sales by product name.</li>
<li>The <b>value axis</b> runs along the vertical side and shows the data series values. The <b>category axis</b> runs along the horizontal side and shows the category values.</li>
<li><b>Clustered column:</b> separate columns side by side to compare values across categories.</li>
<li><b>Stacked column:</b> combines the series in one column to show how much each item contributes to the total.</li>
<li><b>100% stacked column:</b> same as stacked, but the sections are percentages of the whole.</li>
<li><b>Gap width</b> is the space between one category and the next. Change it in the Format pane (right click a data bar).</li>
<li><b>Gridlines</b> extend from the axes into the plot area and help you read values.</li>
</ul>`, 'charts');
mc('m4_column', 'Which chart type puts each data series in its own column, side by side, within each category?', 'Clustered column', ['Stacked column', '100% stacked column', 'Pie'], 'Clustered columns let you compare heights directly.');

<script>
/* Visuals: mini Excel grids, window mock, chart pictures, copy lab. */
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function fmtCell(raw, fmt) {
  if (raw === undefined || raw === null || raw === '') return { t: '', num: false };
  if (typeof raw === 'object' && raw.d) return { t: XL.fmtDate(XL.cellValue(raw)), num: true };
  if (typeof raw === 'number') {
    if (fmt === 'pct') return { t: (Math.round(raw * 1000) / 10) + '%', num: true };
    if (fmt === 'usd') return { t: '$' + raw.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }), num: true };
    const isInt = Math.abs(raw - Math.round(raw)) < 1e-9;
    return { t: isInt ? raw.toLocaleString('en-US') : String(raw), num: true };
  }
  return { t: String(raw), num: false };
}

/* Draw a grid. grid: {A1:value}. opts: {target, copy, hide, hl, hl2, active, fmt:{cell:'pct'}, minCol,maxCol,minRow,maxRow, cls:{cell:'top'}, text:{cell:string}} */
function gridHTML(grid, opts) {
  opts = opts || {};
  const keys = Object.keys(grid || {}).concat(opts.target ? [opts.target] : [], opts.copy || [], opts.show || []);
  let c1 = 99, c2 = 1, r1 = 9999, r2 = 1;
  keys.forEach((k) => { const a = XL.parseAddr(k); if (!a) return; c1 = Math.min(c1, a.col); c2 = Math.max(c2, a.col); r1 = Math.min(r1, a.row); r2 = Math.max(r2, a.row); });
  if (opts.minCol) c1 = Math.min(c1, opts.minCol); if (opts.maxCol) c2 = Math.max(c2, opts.maxCol);
  if (opts.minRow) r1 = Math.min(r1, opts.minRow); if (opts.maxRow) r2 = Math.max(r2, opts.maxRow);
  if (c1 > c2) { c1 = 1; c2 = 3; r1 = 1; r2 = 3; }
  const hide = new Set(opts.hide || []); const copy = new Set(opts.copy || []);
  const rangeSet = (list) => { const s = new Set(); (list || []).forEach((rg) => { const m = rg.split(':'); const a = XL.parseAddr(m[0]), b = XL.parseAddr(m[1] || m[0]); for (let r = Math.min(a.row, b.row); r <= Math.max(a.row, b.row); r++) for (let c = Math.min(a.col, b.col); c <= Math.max(a.col, b.col); c++) s.add(XL.addrText(c, r)); }); return s; };
  const hl = rangeSet(opts.hl), hl2 = rangeSet(opts.hl2);
  let h = '<div class="xlwrap"><table class="xl"><tr><th class="rh"></th>';
  for (let c = c1; c <= c2; c++) h += '<th>' + XL.numToCol(c) + '</th>';
  h += '</tr>';
  const used = new Set(keys.map((k) => { const x = XL.parseAddr(k); return x ? x.row : -1; }));
  let gapShown = false;
  for (let r = r1; r <= r2; r++) {
    if (opts.compact && !used.has(r)) { if (!gapShown) { h += '<tr><th class="rh">&#8942;</th><td colspan="' + (c2 - c1 + 1) + '" style="color:#9aa4b1;text-align:center">more rows</td></tr>'; gapShown = true; } continue; }
    gapShown = false;
    h += '<tr><th class="rh">' + r + '</th>';
    for (let c = c1; c <= c2; c++) {
      const a = XL.addrText(c, r); let raw = grid[a]; let txt, num;
      if (hide.has(a)) { raw = ''; }
      if (opts.text && opts.text[a] !== undefined) { txt = opts.text[a]; num = !isNaN(Number(String(txt).replace(/[$,%()\s-]/g, ''))) && String(txt).trim() !== ''; }
      else { const f = fmtCell(raw, opts.fmt && opts.fmt[a]); txt = f.t; num = f.num; }
      let cls = num ? 'n' : '';
      if (opts.target === a) { cls += ' tgt'; if (txt === '') txt = '?'; }
      else if (copy.has(a)) { cls += ' cp'; }
      if (hl.has(a)) cls += ' hl'; if (hl2.has(a)) cls += ' hl2';
      if (opts.cls && opts.cls[a]) cls += ' ' + opts.cls[a];
      if (opts.active === a) cls += ' act';
      h += '<td class="' + cls.trim() + '">' + esc(txt) + (opts.active === a ? '<span class="fh"></span>' : '') + '</td>';
    }
    h += '</tr>';
  }
  return h + '</table></div>';
}

/* ---- named visuals shown inside skill cards ---- */

    '';
};

};
VIS.numfmt = function () {

  return h + '</table><div class="cap">Currency: symbol next to the first digit, minus sign for negatives. Accounting: symbol at the left edge, parentheses for negatives, dash for zero.</div>';

};

};

/* SVG charts */
const PAL = ['#00529B', '#FFB81C', '#2A9D8F', '#C8553D', '#8D99AE'];
function svgPie(vals) {
  const tot = vals.reduce((a, b) => a + b, 0); let ang = -Math.PI / 2; let s = '';
  vals.forEach((v, i) => { const a2 = ang + (v / tot) * Math.PI * 2; const x1 = 110 + 55 * Math.cos(ang), y1 = 75 + 55 * Math.sin(ang), x2 = 110 + 55 * Math.cos(a2), y2 = 75 + 55 * Math.sin(a2); s += '<path d="M110 75 L' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' A55 55 0 ' + ((a2 - ang) > Math.PI ? 1 : 0) + ' 1 ' + x2.toFixed(1) + ' ' + y2.toFixed(1) + ' Z" fill="' + PAL[i % 5] + '" stroke="#fff"/>'; ang = a2; });
  return '<svg viewBox="0 0 220 150" role="img" aria-label="Pie chart">' + s + '</svg>';
}
function svgCols(series, stacked) {
  let s = '<line x1="25" y1="125" x2="210" y2="125" stroke="#888"/><line x1="25" y1="15" x2="25" y2="125" stroke="#888"/>';
  const cats = series[0].length; const w = 170 / cats;
  for (let c = 0; c < cats; c++) {
    if (stacked) { let y = 125; series.forEach((sr, i) => { const h = sr[c] * 1.1; y -= h; s += '<rect x="' + (32 + c * w) + '" y="' + y + '" width="' + (w - 14) + '" height="' + h + '" fill="' + PAL[i] + '"/>'; }); }
    else series.forEach((sr, i) => { const bw = (w - 10) / series.length; const h = sr[c] * 1.1; s += '<rect x="' + (30 + c * w + i * bw) + '" y="' + (125 - h) + '" width="' + (bw - 1) + '" height="' + h + '" fill="' + PAL[i] + '"/>'; });
  }
  return '<svg viewBox="0 0 220 150" role="img" aria-label="Column chart">' + s + '</svg>';
}
function svgLine(vals) {
  let s = '<line x1="25" y1="125" x2="210" y2="125" stroke="#888"/><line x1="25" y1="15" x2="25" y2="125" stroke="#888"/>';
  const pts = vals.map((v, i) => [35 + i * (165 / (vals.length - 1)), 125 - v * 1.1]);
  s += '<polyline fill="none" stroke="' + PAL[0] + '" stroke-width="2.5" points="' + pts.map((p) => p.join(',')).join(' ') + '"/>';
  pts.forEach((p) => { s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.5" fill="' + PAL[1] + '" stroke="' + PAL[0] + '"/>'; });
  return '<svg viewBox="0 0 220 150" role="img" aria-label="Line chart">' + s + '</svg>';
}
function svgScatter(pts) {
  let s = '<line x1="25" y1="125" x2="210" y2="125" stroke="#888"/><line x1="25" y1="15" x2="25" y2="125" stroke="#888"/>';
  pts.forEach((p) => { s += '<circle cx="' + (25 + p[0] * 1.8) + '" cy="' + (125 - p[1] * 1.0) + '" r="4" fill="' + PAL[2] + '"/>'; });
  return '<svg viewBox="0 0 220 150" role="img" aria-label="Scatter chart">' + s + '</svg>';
}
VIS.charts = function () {
